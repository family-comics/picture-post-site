<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Picture Post</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 16px 10px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 5px 0 0;
      color: #ccc;
      font-size: 13px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 10px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 13px;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .top-buttons {
      display: flex;
      gap: 7px;
      margin-bottom: 10px;
    }

    .top-buttons button {
      flex: 1;
      background: #111;
      color: white;
    }

    .box {
      background: white;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 9px rgba(0,0,0,.07);
    }

    .box h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    #currentFolder {
      color: #666;
      font-size: 13px;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .folder-actions {
      display: flex;
      gap: 7px;
      margin-bottom: 10px;
    }

    .folder-actions button {
      flex: 1;
      background: #111;
      color: white;
    }

    .folders {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .folder {
      background: #f1f1f1;
      padding: 10px 7px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .folder-open {
      width: 100%;
      background: transparent;
      padding: 7px 4px;
      text-align: center;
    }

    .folder-icon {
      display: block;
      font-size: 27px;
      margin-bottom: 4px;
    }

    .folder-name {
      display: block;
      font-size: 13px;
      font-weight: bold;
      word-break: break-word;
    }

    .folder-manage {
      display: flex;
      gap: 5px;
      margin-top: 7px;
    }

    .folder-manage button {
      flex: 1;
      padding: 7px 4px;
      font-size: 12px;
    }

    .rename-button {
      background: #e8eefc;
      color: #174ea6;
    }

    .delete-button {
      background: #ffe4e4;
      color: #b00020;
    }

    input[type="file"] {
      width: 100%;
      margin: 8px 0;
    }

    #previewArea {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin: 8px 0;
    }

    .preview-item {
      position: relative;
      background: #eee;
      border-radius: 9px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preview-number {
      position: absolute;
      left: 5px;
      top: 5px;
      background: rgba(0,0,0,.75);
      color: white;
      padding: 3px 7px;
      border-radius: 7px;
      font-size: 11px;
    }

    #uploadButton {
      width: 100%;
      background: #111;
      color: white;
    }

    #message {
      text-align: center;
      margin-top: 8px;
      font-size: 13px;
      font-weight: bold;
      word-break: break-word;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .photo-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      position: relative;
    }

    .photo-number {
      position: absolute;
      top: 7px;
      left: 7px;
      z-index: 5;
      background: rgba(0,0,0,.78);
      color: white;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
    }

    .photo-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    .photo-info {
      padding: 7px;
    }

    .like-button {
      width: 100%;
      background: #f1f1f1;
      color: #222;
      margin-bottom: 6px;
    }

    .like-button.liked {
      background: #ffe1e5;
      color: #d60025;
    }

    .photo-delete-button {
      width: 100%;
      background: #ffe4e4;
      color: #b00020;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
      grid-column: 1 / -1;
    }

    #viewer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.94);
      z-index: 100;
      display: none;
      flex-direction: column;
    }

    .viewer-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
    }

    .viewer-top button {
      background: #333;
      color: white;
    }

    #viewerImage {
      width: 100%;
      flex: 1;
      object-fit: contain;
      min-height: 0;
      padding: 5px;
    }

    .viewer-bottom {
      display: flex;
      gap: 7px;
      padding: 10px;
    }

    .viewer-bottom button {
      flex: 1;
      background: #333;
      color: white;
    }

    #viewerLike {
      background: #b00020;
    }

    @media (max-width: 420px) {

      .gallery {
        gap: 7px;
      }

      .photo-card img {
        height: 145px;
      }

      .folders {
        gap: 6px;
      }

      .folder-name {
        font-size: 12px;
      }

      #previewArea {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📸 Picture Post</h1>
  <p>ছবি শেয়ার করার সহজ জায়গা</p>
</header>

<div class="container">

  <div class="top-buttons">
    <button onclick="goHome()">🏠 Home</button>
    <button onclick="goBack()">⬅️ Back</button>
  </div>

  <div class="box">

    <h2>📁 Picture Folder</h2>

    <div id="currentFolder">📁 Home</div>

    <div class="folder-actions">
      <button onclick="createFolder()">➕ নতুন Folder</button>
      <button onclick="refreshFolders()">🔄 Refresh</button>
    </div>

    <div id="folders" class="folders">
      <div class="empty">⏳ Folder লোড হচ্ছে...</div>
    </div>

  </div>

  <div class="box">

    <h2>📤 ছবি পোস্ট করুন</h2>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
      multiple
    >

    <div id="previewArea"></div>

    <button id="uploadButton">
      📤 ছবি পোস্ট করুন
    </button>

    <div id="message"></div>

  </div>

  <div class="box">

    <h2>🖼️ পোস্ট করা ছবি</h2>

    <div id="gallery" class="gallery">
      <div class="empty">ছবি লোড হচ্ছে...</div>
    </div>

  </div>

</div>


<!-- IMAGE VIEWER -->

<div id="viewer">

  <div class="viewer-top">

    <button onclick="closeViewer()">
      ✕ বন্ধ
    </button>

    <button onclick="goHome(); closeViewer();">
      🏠 Home
    </button>

  </div>

  <img id="viewerImage">

  <div class="viewer-bottom">

    <button onclick="previousImage()">
      👈
    </button>

    <button
      id="viewerLike"
      onclick="likeCurrentImage()"
    >
      ❤️ 0
    </button>

    <button onclick="nextImage()">
      👉
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://vhqiqbapbxwmvycxrsvc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CIj1SRMGjbByiTkx-Yx8Eg_g7jHkTh9";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const photoInput =
  document.getElementById("photoInput");

const previewArea =
  document.getElementById("previewArea");

const uploadButton =
  document.getElementById("uploadButton");

const message =
  document.getElementById("message");

const gallery =
  document.getElementById("gallery");

const folders =
  document.getElementById("folders");

const currentFolder =
  document.getElementById("currentFolder");

const viewer =
  document.getElementById("viewer");

const viewerImage =
  document.getElementById("viewerImage");

const viewerLike =
  document.getElementById("viewerLike");


/* =========================
   FOLDER STATE
========================= */

let allFolders = [];

let currentFolderId = null;

let currentPath = [];

let currentImages = [];

let currentViewerIndex = 0;


/* =========================
   LOAD FOLDERS
========================= */

async function loadFolders() {

  folders.innerHTML =
    '<div class="empty">⏳ Folder লোড হচ্ছে...</div>';

  const { data, error } =
    await supabaseClient
      .from("folders")
      .select("id,name,parent_id")
      .order("id", {
        ascending: true
      });


  if (error) {

    console.error(error);

    folders.innerHTML =
      '<div class="empty">❌ Folder লোড করা যায়নি।</div>';

    return;

  }


  allFolders =
    data || [];


  renderFolders();

}


/* =========================
   CURRENT PATH
========================= */

function getCurrentPath() {

  if (!currentFolderId) {
    return [];
  }


  const result = [];

  let id =
    currentFolderId;


  while (id) {

    const folder =
      allFolders.find(
        item =>
          item.id === id
      );


    if (!folder) {
      break;
    }


    result.unshift(
      folder.name
    );


    id =
      folder.parent_id;

  }


  return result;

}


/* =========================
   SAFE STORAGE PATH
========================= */

function getStoragePath() {

  if (!currentFolderId) {
    return "";
  }


  return getFolderStoragePath(
    currentFolderId
  );

}


function getFolderStoragePath(
  folderId
) {

  const parts = [];

  let id =
    folderId;


  while (id) {

    const folder =
      allFolders.find(
        item =>
          item.id === id
      );


    if (!folder) {
      break;
    }


    /*
      গুরুত্বপূর্ণ:
      Folder-এর বাংলা নাম Storage path-এ
      ব্যবহার করা হচ্ছে না।

      শুধু ID ব্যবহার হচ্ছে।
      তাই বাংলা নাম হলেও
      Invalid key হবে না।
    */

    parts.unshift(
      "folder_" + folder.id
    );


    id =
      folder.parent_id;

  }


  return parts.join("/");

}


/* =========================
   RENDER FOLDERS
========================= */

function renderFolders() {

  folders.innerHTML = "";


  const path =
    getCurrentPath();


  currentPath =
    path;


  currentFolder.textContent =
    path.length === 0
      ? "📁 Home"
      : "📁 " + path.join(" / ");


  const children =
    allFolders.filter(
      folder =>
        folder.parent_id === currentFolderId
    );


  if (children.length === 0) {

    folders.innerHTML =
      '<div class="empty">এই Folder-এ এখনো কোনো Sub-folder নেই।</div>';

    return;

  }


  children.forEach(
    function(folder) {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "folder";


      const openButton =
        document.createElement(
          "button"
        );

      openButton.className =
        "folder-open";


      openButton.innerHTML =
        '<span class="folder-icon">📁</span>' +
        '<span class="folder-name">' +
        escapeHtml(
          folder.name
        ) +
        '</span>';


      openButton.onclick =
        function() {

          openFolder(
            folder.id
          );

        };


      const manage =
        document.createElement(
          "div"
        );

      manage.className =
        "folder-manage";


      const renameButton =
        document.createElement(
          "button"
        );

      renameButton.className =
        "rename-button";

      renameButton.textContent =
        "✏️ Rename";


      renameButton.onclick =
        function(event) {

          event.stopPropagation();

          renameFolder(
            folder
          );

        };


      const deleteButton =
        document.createElement(
          "button"
        );

      deleteButton.className =
        "delete-button";

      deleteButton.textContent =
        "🗑️ Delete";


      deleteButton.onclick =
        function(event) {

          event.stopPropagation();

          deleteFolder(
            folder
          );

        };


      manage.appendChild(
        renameButton
      );

      manage.appendChild(
        deleteButton
      );


      div.appendChild(
        openButton
      );

      div.appendChild(
        manage
      );


      folders.appendChild(
        div
      );

    }
  );

}


/* =========================
   OPEN FOLDER
========================= */

function openFolder(id) {

  currentFolderId =
    id;


  renderFolders();

  loadPhotos();

}


/* =========================
   HOME
========================= */

function goHome() {

  currentFolderId =
    null;


  renderFolders();

  loadPhotos();

}


/* =========================
   BACK
========================= */

function goBack() {

  if (!currentFolderId) {
    return;
  }


  const current =
    allFolders.find(
      folder =>
        folder.id === currentFolderId
    );


  currentFolderId =
    current
      ? current.parent_id
      : null;


  renderFolders();

  loadPhotos();

}


/* =========================
   CREATE FOLDER
========================= */

async function createFolder() {

  const folderName =
    prompt(
      currentFolderId
        ? "Sub-folder-এর নাম লিখুন:"
        : "নতুন Folder-এর নাম লিখুন:"
    );


  if (!folderName) {
    return;
  }


  const cleanName =
    folderName.trim();


  if (!cleanName) {
    return;
  }


  const exists =
    allFolders.some(
      folder =>
        folder.parent_id === currentFolderId &&
        folder.name.toLowerCase() ===
        cleanName.toLowerCase()
    );


  if (exists) {

    alert(
      "এই নামে Folder আগে থেকেই আছে।"
    );

    return;

  }


  const { error } =
    await supabaseClient
      .from("folders")
      .insert({

        name:
          cleanName,

        parent_id:
          currentFolderId

      });


  if (error) {

    alert(
      "❌ Folder তৈরি হয়নি: " +
      error.message
    );

    return;

  }


  await loadFolders();

}


/* =========================
   RENAME FOLDER
========================= */

async function renameFolder(
  folder
) {

  const newName =
    prompt(
      "নতুন Folder নাম লিখুন:",
      folder.name
    );


  if (!newName) {
    return;
  }


  const cleanName =
    newName.trim();


  if (!cleanName) {
    return;
  }


  if (
    cleanName ===
    folder.name
  ) {
    return;
  }


  const exists =
    allFolders.some(
      item =>
        item.id !== folder.id &&
        item.parent_id === folder.parent_id &&
        item.name.toLowerCase() ===
        cleanName.toLowerCase()
    );


  if (exists) {

    alert(
      "এই নামে Folder আগে থেকেই আছে।"
    );

    return;

  }


  /*
    নতুন Storage system-এ
    Folder নাম Storage path-এর অংশ নয়।

    তাই Rename করলে ছবি সরানোর দরকার নেই।
    শুধু Database-এর নাম বদলালেই হবে।
  */

  const { error } =
    await supabaseClient
      .from("folders")
      .update({
        name:
          cleanName
      })
      .eq(
        "id",
        folder.id
      );


  if (error) {

    alert(
      "❌ Rename হয়নি: " +
      error.message
    );

    return;

  }


  message.textContent =
    "✅ Folder Rename হয়েছে।";


  await loadFolders();

  loadPhotos();

}


/* =========================
   GET DESCENDANT IDS
========================= */

function getDescendantIds(
  parentId
) {

  const result = [];


  const children =
    allFolders.filter(
      folder =>
        folder.parent_id === parentId
    );


  for (
    const child of children
  ) {

    result.push(
      child.id
    );


    result.push(
      ...getDescendantIds(
        child.id
      )
    );

  }


  return result;

}


/* =========================
   DELETE FOLDER
========================= */

async function deleteFolder(
  folder
) {

  const answer =
    confirm(
      '🗑️ "' +
      folder.name +
      '" Folder Delete করবেন?\n\nএই Folder-এর ভিতরের ছবি ও Sub-folder-ও মুছে যাবে।'
    );


  if (!answer) {
    return;
  }


  message.textContent =
    "⏳ Folder Delete হচ্ছে...";


  const ids =
    getDescendantIds(
      folder.id
    );


  ids.push(
    folder.id
  );


  /*
    সব descendant folder-এর
    Storage path Delete করা হবে।
  */

  for (
    const id of ids
  ) {

    const storagePath =
      getFolderStoragePath(
        id
      );


    const removed =
      await deleteStorageTree(
        storagePath
      );


    if (!removed) {

      message.textContent =
        "❌ Folder-এর ছবি Delete করা যায়নি।";

      return;

    }

  }


  const { error } =
    await supabaseClient
      .from("folders")
      .delete()
      .in(
        "id",
        ids
      );


  if (error) {

    alert(
      "❌ Folder Delete হয়নি: " +
      error.message
    );

    return;

  }


  message.textContent =
    "✅ Folder Delete হয়েছে।";


  if (
    ids.includes(
      currentFolderId
    )
  ) {

    currentFolderId =
      folder.parent_id;

  }


  await loadFolders();

  loadPhotos();

}


/* =========================
   STORAGE LIST
========================= */

async function listStorageFiles(
  path
) {

  const { data, error } =
    await supabaseClient
      .storage
      .from("photos")
      .list(
        path,
        {
          limit: 1000
        }
      );


  if (error) {

    console.error(error);

    return null;

  }


  const files = [];


  for (
    const item of data || []
  ) {

    const fullPath =
      path
        ? path + "/" + item.name
        : item.name;


    if (
      item.metadata
    ) {

      files.push(
        fullPath
      );

    } else {

      const childFiles =
        await listStorageFiles(
          fullPath
        );


      if (
        childFiles === null
      ) {

        return null;

      }


      files.push(
        ...childFiles
      );

    }

  }


  return files;

}


/* =========================
   DELETE STORAGE TREE
========================= */

async function deleteStorageTree(
  path
) {

  const files =
    await listStorageFiles(
      path
    );


  if (files === null) {
    return false;
  }


  if (
    files.length === 0
  ) {

    return true;

  }


  const { error } =
    await supabaseClient
      .storage
      .from("photos")
      .remove(
        files
      );


  if (error) {

    console.error(error);

    return false;

  }


  return true;

}


/* =========================
   DELETE ONE PHOTO
========================= */

async function deletePhoto(
  fullPath,
  card
) {

  const answer =
    confirm(
      "🗑️ এই ছবিটি Delete করবেন?"
    );


  if (!answer) {
    return;
  }


  const deleteButton =
    card.querySelector(
      ".photo-delete-button"
    );


  if (deleteButton) {
    deleteButton.disabled = true;
    deleteButton.textContent =
      "⏳ Delete হচ্ছে...";
  }


  const { error } =
    await supabaseClient
      .storage
      .from("photos")
      .remove([
        fullPath
      ]);


  if (error) {

    console.error(error);

    alert(
      "❌ ছবি Delete হয়নি: " +
      error.message
    );


    if (deleteButton) {
      deleteButton.disabled = false;
      deleteButton.textContent =
        "🗑️ Delete";
    }


    return;

  }


  /*
    Photo-এর Like record থাকলে
    সেটা পরিষ্কার করার চেষ্টা।
    Permission না থাকলেও ছবির Delete
    আটকে যাবে না।
  */

  await supabaseClient
    .from("photo_likes")
    .delete()
    .eq(
      "photo_name",
      fullPath
    );


  message.textContent =
    "✅ ছবি Delete হয়েছে।";


  /*
    Viewer-এ যদি Delete করা ছবি
    খোলা থাকে, Viewer বন্ধ।
  */

  if (
    viewer.style.display === "flex"
  ) {

    closeViewer();

  }


  await loadPhotos();

}


/* =========================
   REFRESH
========================= */

function refreshFolders() {

  loadFolders();

  loadPhotos();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


/* =========================
   FILE EXTENSION
========================= */

function getFileExtension(
  file
) {

  const originalName =
    file.name || "";


  const dot =
    originalName.lastIndexOf(".");


  if (
    dot !== -1 &&
    dot < originalName.length - 1
  ) {

    const ext =
      originalName
        .substring(dot + 1)
        .toLowerCase()
        .replace(
          /[^a-z0-9]/g,
          ""
        );


    if (ext) {
      return ext;
    }

  }


  if (
    file.type === "image/png"
  ) {
    return "png";
  }


  if (
    file.type === "image/webp"
  ) {
    return "webp";
  }


  if (
    file.type === "image/gif"
  ) {
    return "gif";
  }


  return "jpg";

}

/* =========================
   UPLOAD MULTIPLE PHOTOS
========================= */

uploadButton.addEventListener(
  "click",
  async function() {

    const files =
      Array.from(
        photoInput.files || []
      );


    if (
      files.length === 0
    ) {

      message.textContent =
        "❌ আগে ছবি নির্বাচন করুন।";

      return;

    }


    uploadButton.disabled =
      true;


    photoInput.disabled =
      true;


    let successCount =
      0;


    let failedCount =
      0;


    try {

      const folderPath =
        getStoragePath();


      for (
        let i = 0;
        i < files.length;
        i++
      ) {

        const file =
          files[i];


        message.textContent =
          "⏳ ছবি " +
          (i + 1) +
          " / " +
          files.length +
          " আপলোড হচ্ছে...";


        const extension =
          getFileExtension(
            file
          );


        /*
          Storage filename পুরোপুরি
          English/number based।

          তাই বাংলা filename বা
          বাংলা Folder name-এর কারণে
          Invalid key হবে না।
        */

        const fileName =
          Date.now() +
          "-" +
          String(i + 1)
            .padStart(
              3,
              "0"
            ) +
          "-" +
          Math.random()
            .toString(36)
            .substring(
              2,
              8
            ) +
          "." +
          extension;


        const storagePath =
          folderPath
            ? folderPath +
              "/" +
              fileName
            : fileName;


        const { error } =
          await supabaseClient
            .storage
            .from("photos")
            .upload(
              storagePath,
              file,
              {
                upsert: false,
                contentType:
                  file.type ||
                  "image/jpeg"
              }
            );


        if (error) {

          console.error(
            "Upload error:",
            error
          );


          failedCount++;

        } else {

          successCount++;

        }

      }


      if (
        successCount > 0 &&
        failedCount === 0
      ) {

        message.textContent =
          "✅ " +
          successCount +
          "টি ছবি সফলভাবে পোস্ট হয়েছে!";

      } else if (
        successCount > 0 &&
        failedCount > 0
      ) {

        message.textContent =
          "⚠️ " +
          successCount +
          "টি ছবি পোস্ট হয়েছে, " +
          failedCount +
          "টি হয়নি।";

      } else {

        message.textContent =
          "❌ কোনো ছবি পোস্ট হয়নি।";

      }


      photoInput.value =
        "";


      previewArea.innerHTML =
        "";


      await loadPhotos();


    } catch (error) {

      console.error(error);

      message.textContent =
        "❌ ছবি পোস্ট হয়নি: " +
        error.message;

    }


    uploadButton.disabled =
      false;


    photoInput.disabled =
      false;

  }
);


/* =========================
   LOAD PHOTOS
========================= */

async function loadPhotos() {

  gallery.innerHTML =
    '<div class="empty">⏳ ছবি লোড হচ্ছে...</div>';


  const folderPath =
    getStoragePath();


  const { data, error } =
    await supabaseClient
      .storage
      .from("photos")
      .list(
        folderPath,
        {
          limit: 1000,
          sortBy: {
            column: "name",
            order: "asc"
          }
        }
      );


  if (error) {

    console.error(error);

    gallery.innerHTML =
      '<div class="empty">❌ ছবি লোড করা যায়নি।</div>';

    return;

  }


  const files =
    (data || [])
      .filter(
        file =>
          file.name &&
          file.metadata
      );


  currentImages =
    files;


  if (
    files.length === 0
  ) {

    gallery.innerHTML =
      '<div class="empty">এই Folder-এ এখনো কোনো ছবি নেই।</div>';

    return;

  }


  gallery.innerHTML =
    "";


  for (
    let i = 0;
    i < files.length;
    i++
  ) {

    const file =
      files[i];


    const fullPath =
      folderPath
        ? folderPath +
          "/" +
          file.name
        : file.name;


    const { data: publicData } =
      supabaseClient
        .storage
        .from("photos")
        .getPublicUrl(
          fullPath
        );


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "photo-card";


    const number =
      document.createElement(
        "div"
      );


    number.className =
      "photo-number";


    number.textContent =
      "#" + (i + 1);


    const img =
      document.createElement(
        "img"
      );


    img.src =
      publicData.publicUrl;


    img.alt =
      "Posted picture " +
      (i + 1);


    img.onclick =
      function() {

        openViewer(i);

      };


    const info =
      document.createElement(
        "div"
      );


    info.className =
      "photo-info";


    const likeButton =
      document.createElement(
        "button"
      );


    likeButton.className =
      "like-button";


    likeButton.textContent =
      "❤️ লোড হচ্ছে...";


    likeButton.onclick =
      async function(event) {

        event.stopPropagation();


        await addLike(
          fullPath,
          likeButton
        );

      };


    const deleteButton =
      document.createElement(
        "button"
      );


    deleteButton.className =
      "photo-delete-button";


    deleteButton.textContent =
      "🗑️ Delete";


    deleteButton.onclick =
      async function(event) {

        event.stopPropagation();


        await deletePhoto(
          fullPath,
          card
        );

      };


    info.appendChild(
      likeButton
    );


    info.appendChild(
      deleteButton
    );


    card.appendChild(
      number
    );


    card.appendChild(
      img
    );


    card.appendChild(
      info
    );


    gallery.appendChild(
      card
    );


    loadLikeCount(
      fullPath,
      likeButton
    );

  }

}


/* =========================
   LIKE COUNT
========================= */

async function loadLikeCount(
  photoName,
  button
) {

  const { data, error } =
    await supabaseClient
      .from("photo_likes")
      .select(
        "like_count"
      )
      .eq(
        "photo_name",
        photoName
      )
      .maybeSingle();


  if (error) {

    button.textContent =
      "❤️ 0";

    return;

  }


  const count =
    data
      ? data.like_count
      : 0;


  button.textContent =
    "❤️ " + count;

}


/* =========================
   ADD LIKE
========================= */

async function addLike(
  photoName,
  button
) {

  button.disabled =
    true;


  const { data: oldData } =
    await supabaseClient
      .from("photo_likes")
      .select(
        "like_count"
      )
      .eq(
        "photo_name",
        photoName
      )
      .maybeSingle();


  if (!oldData) {

    const { error } =
      await supabaseClient
        .from("photo_likes")
        .insert({
          photo_name:
            photoName,

          like_count:
            1
        });


    if (!error) {

      button.textContent =
        "❤️ 1";


      button.classList.add(
        "liked"
      );

    }

  } else {

    const newCount =
      (oldData.like_count || 0) +
      1;


    const { error } =
      await supabaseClient
        .from("photo_likes")
        .update({
          like_count:
            newCount
        })
        .eq(
          "photo_name",
          photoName
        );


    if (!error) {

      button.textContent =
        "❤️ " +
        newCount;


      button.classList.add(
        "liked"
      );

    }

  }


  button.disabled =
    false;

}


/* =========================
   IMAGE VIEWER
========================= */

function openViewer(
  index
) {

  if (
    !currentImages.length
  ) {
    return;
  }


  currentViewerIndex =
    index;


  showViewerImage();


  viewer.style.display =
    "flex";

}


function closeViewer() {

  viewer.style.display =
    "none";

}


async function showViewerImage() {

  const file =
    currentImages[
      currentViewerIndex
    ];


  if (!file) {
    return;
  }


  const folderPath =
    getStoragePath();


  const fullPath =
    folderPath
      ? folderPath +
        "/" +
        file.name
      : file.name;


  const { data } =
    supabaseClient
      .storage
      .from("photos")
      .getPublicUrl(
        fullPath
      );


  viewerImage.src =
    data.publicUrl;


  loadViewerLike(

}


async function loadViewerLike(
  photoName
) {

  const { data } =
    await supabaseClient
      .from("photo_likes")
      .select(
        "like_count"
      )
      .eq(
        "photo_name",
        photoName
      )
      .maybeSingle();


  const count =
    data
      ? data.like_count
      : 0;


  viewerLike.textContent =
    "❤️ " + count;

}


async function likeCurrentImage() {

  const file =
    currentImages[
      currentViewerIndex
    ];


  if (!file) {
    return;
  }


  const folderPath =
    getStoragePath();


  const fullPath =
    folderPath
      ? folderPath +
        "/" +
        file.name
      : file.name;


  await addLike(
    fullPath,
    viewerLike
  );

}


function previousImage() {

  if (
    !currentImages.length
  ) {
    return;
  }


  currentViewerIndex--;


  if (
    currentViewerIndex < 0
  ) {

    currentViewerIndex =
      currentImages.length - 1;

  }


  showViewerImage();

}


function nextImage() {

  if (
    !currentImages.length
  ) {
    return;
  }


  currentViewerIndex++;


  if (
    currentViewerIndex >=
    currentImages.length
  ) {

    currentViewerIndex =
      0;

  }


  showViewerImage();

}


/* =========================
   SWIPE
========================= */

let touchStartX =
  0;

let touchEndX =
  0;


viewerImage.addEventListener(
  "touchstart",
  function(event) {

    touchStartX =
      event.changedTouches[0]
        .screenX;

  },
  {
    passive: true
  }
);


viewerImage.addEventListener(
  "touchend",
  function(event) {

    touchEndX =
      event.changedTouches[0]
        .screenX;


    const difference =
      touchEndX -
      touchStartX;


    if (
      Math.abs(difference) < 50
    ) {
      return;
    }


    if (
      difference > 0
    ) {

      previousImage();

    } else {

      nextImage();

    }

  },
  {
    passive: true
  }
);
