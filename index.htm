<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Picture Post</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 12px 10px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 5px 0 7px;
      color: #ccc;
      font-size: 13px;
    }

    .auth-area {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .auth-button {
      background: #333;
      color: white;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 11px;
    }

    .admin-status {
      display: none;
      color: #9cff9c;
      font-size: 11px;
      margin-top: 5px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 8px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 9px 11px;
      font-size: 13px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .top-buttons {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .top-buttons button {
      flex: 1;
      background: #111;
      color: white;
    }

    .box {
      background: white;
      padding: 11px;
      border-radius: 13px;
      margin-bottom: 9px;
      box-shadow: 0 2px 9px rgba(0,0,0,.07);
    }

    .box h2 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    #currentFolder {
      color: #666;
      font-size: 11px;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .folder-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .folder-actions button {
      flex: 1;
      background: #111;
      color: white;
      padding: 7px 5px;
      font-size: 11px;
    }

    .folders {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .folder {
      background: #f1f1f1;
      padding: 5px 3px;
      border-radius: 8px;
      border: 1px solid #ddd;
      min-width: 0;
    }

    .folder-open {
      width: 100%;
      background: transparent;
      padding: 4px 2px;
      text-align: center;
    }

    .folder-icon {
      display: block;
      font-size: 20px;
      line-height: 22px;
      margin-bottom: 2px;
    }

    .folder-name {
      display: block;
      font-size: 10px;
      line-height: 13px;
      font-weight: bold;
      word-break: break-word;
    }

    .folder-manage {
      display: flex;
      gap: 3px;
      margin-top: 4px;
    }

    .folder-manage button {
      flex: 1;
      padding: 5px 2px;
      font-size: 9px;
      border-radius: 6px;
    }

    .rename-button {
      background: #e8eefc;
      color: #174ea6;
    }

    .delete-button {
      background: #ffe4e4;
      color: #b00020;
    }

    input[type="file"] {
      width: 100%;
      margin: 7px 0;
      font-size: 12px;
    }

    #previewArea {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin: 7px 0;
    }

    .preview-item {
      position: relative;
      background: #eee;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preview-number {
      position: absolute;
      left: 4px;
      top: 4px;
      background: rgba(0,0,0,.75);
      color: white;
      padding: 2px 5px;
      border-radius: 5px;
      font-size: 9px;
    }

    #uploadButton {
      width: 100%;
      background: #111;
      color: white;
    }

    #message {
      text-align: center;
      margin-top: 7px;
      font-size: 12px;
      font-weight: bold;
      word-break: break-word;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    .photo-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      position: relative;
    }

    .photo-number {
      position: absolute;
      top: 5px;
      left: 5px;
      z-index: 5;
      background: rgba(0,0,0,.78);
      color: white;
      padding: 3px 6px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: bold;
    }

    .photo-card img {
      width: 100%;
      height: 165px;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    .photo-info {
      padding: 5px;
    }

    .like-button {
      width: 100%;
      background: #f1f1f1;
      color: #222;
      margin-bottom: 5px;
      padding: 7px;
      font-size: 12px;
    }

    .like-button.liked {
      background: #ffe1e5;
      color: #d60025;
    }

    .photo-delete-button {
      width: 100%;
      background: #ffe4e4;
      color: #b00020;
      padding: 7px;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 18px 8px;
      grid-column: 1 / -1;
      font-size: 12px;
    }

    /* =========================
       ADMIN LOGIN
    ========================= */

    #loginModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .login-box {
      width: 100%;
      max-width: 360px;
      background: white;
      border-radius: 15px;
      padding: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,.3);
    }

    .login-box h2 {
      margin: 0 0 12px;
      text-align: center;
    }

    .login-box input {
      width: 100%;
      padding: 11px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    .login-submit {
      width: 100%;
      background: #111;
      color: white;
      margin-top: 4px;
    }

    .login-close {
      width: 100%;
      background: #eee;
      color: #222;
      margin-top: 7px;
    }

    #loginMessage {
      text-align: center;
      font-size: 12px;
      margin-top: 8px;
      word-break: break-word;
    }

    /* =========================
       VIEWER
    ========================= */

    #viewer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.94);
      z-index: 100;
      display: none;
      flex-direction: column;
    }

    .viewer-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px;
      flex-shrink: 0;
    }

    .viewer-top button {
      background: #333;
      color: white;
      padding: 8px 10px;
    }

    .viewer-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #viewerImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
      min-height: 0;
      padding: 5px 45px;
    }

    .viewer-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      width: 38px;
      height: 55px;
      border-radius: 12px;
      background: rgba(255,255,255,.18);
      color: white;
      font-size: 24px;
      line-height: 55px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewer-arrow:active {
      background: rgba(255,255,255,.35);
    }

    .viewer-prev {
      left: 6px;
    }

    .viewer-next {
      right: 6px;
    }

    .viewer-bottom {
      display: flex;
      justify-content: center;
      padding: 8px;
      flex-shrink: 0;
    }

    #viewerLike {
      background: #b00020;
      color: white;
      min-width: 110px;
    }

    @media (max-width: 420px) {

      .container {
        padding: 6px;
      }

      .box {
        padding: 9px;
      }

      .folders {
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }

      .folder {
        padding: 4px 2px;
      }

      .folder-icon {
        font-size: 18px;
        line-height: 20px;
      }

      .folder-name {
        font-size: 9px;
        line-height: 12px;
      }

      .folder-manage button {
        font-size: 8px;
        padding: 4px 1px;
      }

      .gallery {
        gap: 6px;
      }

      .photo-card img {
        height: 145px;
      }

      #viewerImage {
        padding-left: 40px;
        padding-right: 40px;
      }

      .viewer-arrow {
        width: 34px;
        height: 48px;
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<header>

  <h1>📸 Picture Post</h1>

  <p>ছবি শেয়ার করার সহজ জায়গা</p>

  <div class="auth-area">

    <button
      id="loginButton"
      class="auth-button"
      onclick="openLogin()"
    >
      🔐 Admin Login
    </button>

    <button
      id="logoutButton"
      class="auth-button"
      onclick="logoutAdmin()"
      style="display:none;"
    >
      🚪 Logout
    </button>

  </div>

  <div
    id="adminStatus"
    class="admin-status"
  >
    👑 Admin Mode চালু
  </div>

</header>


<div class="container">

  <div class="top-buttons">

    <button onclick="goHome()">
      🏠 Home
    </button>

    <button onclick="goBack()">
      ⬅️ Back
    </button>

  </div>


  <!-- FOLDER -->

  <div class="box">

    <h2>📁 Picture Folder</h2>

    <div id="currentFolder">
      📁 Home
    </div>


    <div
      id="adminFolderActions"
      class="folder-actions"
      style="display:none;"
    >

      <button onclick="createFolder()">
        ➕ নতুন Folder
      </button>

      <button onclick="refreshFolders()">
        🔄 Refresh
      </button>

    </div>


    <div
      id="publicRefreshArea"
      class="folder-actions"
    >

      <button onclick="refreshFolders()">
        🔄 Refresh
      </button>

    </div>


    <div
      id="folders"
      class="folders"
    >

      <div class="empty">
        ⏳ Folder লোড হচ্ছে...
      </div>

    </div>

  </div>


  <!-- ADMIN UPLOAD -->

  <div
    id="adminUploadBox"
    class="box"
    style="display:none;"
  >

    <h2>📤 ছবি পোস্ট করুন</h2>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
      multiple
    >

    <div id="previewArea"></div>

    <button id="uploadButton">
      📤 ছবি পোস্ট করুন
    </button>

    <div id="message"></div>

  </div>


  <!-- GALLERY -->

  <div class="box">

    <h2>🖼️ পোস্ট করা ছবি</h2>

    <div
      id="gallery"
      class="gallery"
    >

      <div class="empty">
        ছবি লোড হচ্ছে...
      </div>

    </div>

  </div>

</div>


<!-- ADMIN LOGIN MODAL -->

<div id="loginModal">

  <div class="login-box">

    <h2>🔐 Admin Login</h2>

    <input
      type="email"
      id="loginEmail"
      placeholder="Admin Email"
      autocomplete="off"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      id="loginSubmit"
      class="login-submit"
      onclick="loginAdmin()"
    >
      🔐 Login
    </button>

    <button
      class="login-close"
      onclick="closeLogin()"
    >
      ✕ বন্ধ
    </button>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- IMAGE VIEWER -->

<div id="viewer">

  <div class="viewer-top">

    <button onclick="closeViewer()">
      ✕ বন্ধ
    </button>

    <button
      onclick="goHome(); closeViewer();"
    >
      🏠 Home
    </button>

  </div>


  <div class="viewer-stage">

    <button
      class="viewer-arrow viewer-prev"
      onclick="previousImage()"
      aria-label="Previous"
    >
      ‹
    </button>

    <img
      id="viewerImage"
      alt="Picture"
    >

    <button
      class="viewer-arrow viewer-next"
      onclick="nextImage()"
      aria-label="Next"
    >
      ›
    </button>

  </div>


  <div class="viewer-bottom">

    <button
      id="viewerLike"
      onclick="likeCurrentImage()"
    >
      ❤️ 0
    </button>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://vhqiqbapbxwmvycxrsvc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CIj1SRMGjbByiTkx-Yx8Eg_g7jHkTh9";

const ADMIN_EMAIL =
  "prince.masud.ak46@gmail.com";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   ELEMENTS
========================= */

const photoInput =
  document.getElementById(
    "photoInput"
  );

const previewArea =
  document.getElementById(
    "previewArea"
  );

const uploadButton =
  document.getElementById(
    "uploadButton"
  );

const message =
  document.getElementById(
    "message"
  );

const gallery =
  document.getElementById(
    "gallery"
  );

const folders =
  document.getElementById(
    "folders"
  );

const currentFolder =
  document.getElementById(
    "currentFolder"
  );

const viewer =
  document.getElementById(
    "viewer"
  );

const viewerImage =
  document.getElementById(
    "viewerImage"
  );

const viewerLike =
  document.getElementById(
    "viewerLike"
  );

const loginModal =
  document.getElementById(
    "loginModal"
  );

const loginEmail =
  document.getElementById(
    "loginEmail"
  );

const loginPassword =
  document.getElementById(
    "loginPassword"
  );

const loginSubmit =
  document.getElementById(
    "loginSubmit"
  );

const loginMessage =
  document.getElementById(
    "loginMessage"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );

const logoutButton =
  document.getElementById(
    "logoutButton"
  );

const adminStatus =
  document.getElementById(
    "adminStatus"
  );

const adminFolderActions =
  document.getElementById(
    "adminFolderActions"
  );

const publicRefreshArea =
  document.getElementById(
    "publicRefreshArea"
  );

const adminUploadBox =
  document.getElementById(
    "adminUploadBox"
  );


/* =========================
   ADMIN STATE
========================= */

let currentUser =
  null;

let isAdmin =
  false;


/* =========================
   CHECK ADMIN
========================= */

function checkAdmin(
  user
) {

  if (!user) {

    return false;

  }

  return (
    String(user.email || "")
      .toLowerCase()
      .trim()
    ===
    ADMIN_EMAIL
      .toLowerCase()
      .trim()
  );

}


/* =========================
   UPDATE UI
========================= */

function updateAdminUI() {

  if (isAdmin) {

    loginButton.style.display =
      "none";

    logoutButton.style.display =
      "inline-block";

    adminStatus.style.display =
      "block";

    adminFolderActions.style.display =
      "flex";

    publicRefreshArea.style.display =
      "none";

    adminUploadBox.style.display =
      "block";

  } else {

    loginButton.style.display =
      "inline-block";

    logoutButton.style.display =
      "none";

    adminStatus.style.display =
      "none";

    adminFolderActions.style.display =
      "none";

    publicRefreshArea.style.display =
      "flex";

    adminUploadBox.style.display =
      "none";

  }

}


/* =========================
   AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
  function(
    event,
    session
  ) {

    currentUser =
      session
        ? session.user
        : null;

    isAdmin =
      checkAdmin(
        currentUser
      );

    updateAdminUI();

    if (
      currentUser &&
      !isAdmin
    ) {

      supabaseClient.auth
        .signOut();

      currentUser =
        null;

      isAdmin =
        false;

      updateAdminUI();

      alert(
        "❌ এই account-এর Admin permission নেই।"
      );

    }

  }
);


/* =========================
   LOGIN MODAL
========================= */

function openLogin() {

  loginModal.style.display =
    "flex";

  loginMessage.textContent =
    "";

  /*
    Guest-এর সামনে Admin Gmail
    আর দেখানো হবে না।
  */

  loginEmail.value =
    "";

  loginPassword.value =
    "";

  setTimeout(
    function() {

      loginEmail.focus();

    },
    100
  );

}


function closeLogin() {

  loginModal.style.display =
    "none";

  loginMessage.textContent =
    "";

}


async function loginAdmin() {

  const email =
    loginEmail.value.trim();

  const password =
    loginPassword.value;


  if (!email) {

    loginMessage.textContent =
      "❌ Email দিন।";

    return;

  }


  if (!password) {

    loginMessage.textContent =
      "❌ Password দিন।";

    return;

  }


  if (
    email.toLowerCase() !==
    ADMIN_EMAIL.toLowerCase()
  ) {

    loginMessage.textContent =
      "❌ এই Email Admin নয়।";

    return;

  }


  loginSubmit.disabled =
    true;

  loginMessage.textContent =
    "⏳ Login হচ্ছে...";


  const { data, error } =
    await supabaseClient.auth
      .signInWithPassword({
        email:
          email,

        password:
          password
      });


  if (error) {

    console.error(
      "Login error:",
      error
    );

    loginMessage.textContent =
      "❌ Login হয়নি: " +
      error.message;

    loginSubmit.disabled =
      false;

    return;

  }


  currentUser =
    data.user;

  isAdmin =
    checkAdmin(
      currentUser
    );


  if (!isAdmin) {

    await supabaseClient.auth
      .signOut();

    currentUser =
      null;

    isAdmin =
      false;

    updateAdminUI();

    loginMessage.textContent =
      "❌ এই account Admin নয়।";

    loginSubmit.disabled =
      false;

    return;

  }


  updateAdminUI();

  loginMessage.textContent =
    "✅ Admin Login সফল হয়েছে!";


  setTimeout(
    function() {

      closeLogin();

      message.textContent =
        "👑 Admin Mode চালু হয়েছে।";

    },
    700
  );


  loginSubmit.disabled =
    false;

}


/* =========================
   LOGOUT
========================= */

async function logoutAdmin() {

  const answer =
    confirm(
      "🚪 Admin Logout করবেন?"
    );


  if (!answer) {
    return;
  }


  await supabaseClient.auth
    .signOut();


  currentUser =
    null;

  isAdmin =
    false;

  updateAdminUI();

  message.textContent =
    "✅ Admin Logout হয়েছে।";

}


/* =========================
   ADMIN SECURITY CHECK
========================= */

function requireAdmin() {

  if (!isAdmin) {

    alert(
      "🔒 এই কাজটি শুধু Admin করতে পারবেন।"
    );

    return false;

  }

  return true;

}


/* =========================
   FOLDER STATE
========================= */

let allFolders = [];

let currentFolderId =
  null;

let currentPath = [];

let currentImages = [];

let currentViewerIndex =
  0;


/* =========================
   SAVE / RESTORE FOLDER
========================= */

const FOLDER_STORAGE_KEY =
  "picture_post_current_folder";


function saveCurrentFolder() {

  if (currentFolderId) {

    localStorage.setItem(
      FOLDER_STORAGE_KEY,
      String(
        currentFolderId
      )
    );

  } else {

    localStorage.removeItem(
      FOLDER_STORAGE_KEY
    );

  }

}


function restoreCurrentFolder() {

  const saved =
    localStorage.getItem(
      FOLDER_STORAGE_KEY
    );


  if (!saved) {

    currentFolderId =
      null;

    return;

  }


  const id =
    Number(saved);


  const exists =
    allFolders.some(
      folder =>
        folder.id === id
    );


  if (exists) {

    currentFolderId =
      id;

  } else {

    currentFolderId =
      null;

    localStorage.removeItem(
      FOLDER_STORAGE_KEY
    );

  }

}


/* =========================
   LOAD FOLDERS
========================= */

async function loadFolders() {

  folders.innerHTML =
    '<div class="empty">⏳ Folder লোড হচ্ছে...</div>';


  const { data, error } =
    await supabaseClient
      .from("folders")
      .select(
        "id,name,parent_id"
      )
      .order(
        "id",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(error);

    folders.innerHTML =
      '<div class="empty">❌ Folder লোড করা যায়নি।</div>';

    return false;

  }


  allFolders =
    data || [];


  restoreCurrentFolder();

  renderFolders();

  return true;

}


/* =========================
   CURRENT PATH
========================= */

function getCurrentPath() {

  if (!currentFolderId) {

    return [];

  }


  const result = [];

  let id =
    currentFolderId;


  while (id) {

    const folder =
      allFolders.find(
        item =>
          item.id === id
      );


    if (!folder) {
      break;
    }


    result.unshift(
      folder.name
    );


    id =
      folder.parent_id;

  }


  return result;

}


/* =========================
   SAFE STORAGE PATH
========================= */

function getStoragePath() {

  if (!currentFolderId) {

    return "";

  }


  return getFolderStoragePath(
    currentFolderId
  );

}


function getFolderStoragePath(
  folderId
) {

  const parts = [];

  let id =
    folderId;


  while (id) {

    const folder =
      allFolders.find(
        item =>
          item.id === id
      );


    if (!folder) {
      break;
    }


    parts.unshift(
      "folder_" +
      folder.id
    );


    id =
      folder.parent_id;

  }


  return parts.join("/");

}

    );

      });

/* =========================
   RENAME FOLDER
========================= */

async function renameFolder(
  folder
) {

  if (!requireAdmin()) {
    return;
  }


  const newName =
    prompt(
      "নতুন Folder নাম লিখুন:",
      folder.name
    );


  if (!newName) {
    return;
  }


  const cleanName =
    newName.trim();


  if (!cleanName) {
    return;
  }


  if (
    cleanName ===
    folder.name
  ) {

    return;

  }


  const exists =
    allFolders.some(
      item =>
        item.id !==
          folder.id &&
        item.parent_id ===
          folder.parent_id &&
        item.name.toLowerCase() ===
          cleanName.toLowerCase()
    );


  if (exists) {

    alert(
      "এই নামে Folder আগে থেকেই আছে।"
    );

    return;

  }


  const { error } =
    await supabaseClient
      .from("folders")
      .update({
        name:
          cleanName
      })
      .eq(
        "id",
        folder.id
      );


  if (error) {

    alert(
      "❌ Rename হয়নি: " +
      error.message
    );

    return;

  }


  message.textContent =
    "✅ Folder Rename হয়েছে।";


  await loadFolders();

  loadPhotos();

}


/* =========================
   GET DESCENDANT IDS
========================= */

function getDescendantIds(
  parentId
) {

  const result = [];


  const children =
    allFolders.filter(
      folder =>
        folder.parent_id ===
        parentId
    );


  for (
    const child of children
  ) {

    result.push(
      child.id
    );


    result.push(
      ...getDescendantIds(
        child.id
      )
    );

  }


  return result;

}


/* =========================
   DELETE FOLDER
========================= */

async function deleteFolder(
  folder
) {

  if (!requireAdmin()) {
    return;
  }


  const answer =
    confirm(
      '🗑️ "' +
      folder.name +
      '" Folder Delete করবেন?\n\nএই Folder-এর ভিতরের ছবি ও Sub-folder-ও মুছে যাবে।'
    );


  if (!answer) {
    return;
  }


  message.textContent =
    "⏳ Folder Delete হচ্ছে...";


  const ids =
    getDescendantIds(
      folder.id
    );


  ids.push(
    folder.id
  );


  for (
    const id of ids
  ) {

    const storagePath =
      getFolderStoragePath(
        id
      );


    const removed =
      await deleteStorageTree(
        storagePath
      );


    if (!removed) {

      message.textContent =
        "❌ Folder-এর ছবি Delete করা যায়নি।";

      return;

    }

  }


  const { error } =
    await supabaseClient
      .from("folders")
      .delete()
      .in(
        "id",
        ids
      );


  if (error) {

    alert(
      "❌ Folder Delete হয়নি: " +
      error.message
    );

    return;

  }


  message.textContent =
    "✅ Folder Delete হয়েছে।";


  if (
    ids.includes(
      currentFolderId
    )
  ) {

    currentFolderId =
      folder.parent_id;

    saveCurrentFolder();

  }


  await loadFolders();

  loadPhotos();

}


/* =========================
   STORAGE LIST
========================= */

async function listStorageFiles(
  path
) {

  const { data, error } =
    await supabaseClient
      .storage
      .from("photos")
      .list(
        path,
        {
          limit: 1000
        }
      );


  if (error) {

    console.error(error);

    return null;

  }


  const files = [];


  for (
    const item of data || []
  ) {

    const fullPath =
      path
        ? path +
          "/" +
          item.name
        : item.name;


    if (
      item.metadata
    ) {

      files.push(
        fullPath
      );

    } else {

      const childFiles =
        await listStorageFiles(
          fullPath
        );


      if (
        childFiles === null
      ) {

        return null;

      }


      files.push(
        ...childFiles
      );

    }

  }


  return files;

}


/* =========================
   DELETE STORAGE TREE
========================= */

async function deleteStorageTree(
  path
) {

  if (!isAdmin) {
    return false;
  }


  const files =
    await listStorageFiles(
      path
    );


  if (files === null) {
    return false;
  }


  if (
    files.length === 0
  ) {

    return true;

  }


  const { error } =
    await supabaseClient
      .storage
      .from("photos")
      .remove(
        files
      );


  if (error) {

    console.error(error);

    return false;

  }


  return true;

}

/* =========================
   FILE EXTENSION
========================= */

function getFileExtension(
  file
) {

  const originalName =
    file.name || "";


  const dot =
    originalName.lastIndexOf(".");


  if (
    dot !== -1 &&
    dot <
      originalName.length - 1
  ) {

    const ext =
      originalName
        .substring(
          dot + 1
        )
        .toLowerCase()
        .replace(
          /[^a-z0-9]/g,
          ""
        );


    if (ext) {

      return ext;

    }

  }


  if (
    file.type ===
    "image/png"
  ) {

    return "png";

  }


  if (
    file.type ===
    "image/webp"
  ) {

    return "webp";

  }


  if (
    file.type ===
    "image/gif"
  ) {

    return "gif";

  }


  return "jpg";

}

/* =========================

========================= */

uploadButton.addEventListener(
  "click",
  async function() {

    if (!requireAdmin()) {
      return;
    }


    const files =
      Array.from(
        photoInput.files || []
      );


    if (
      files.length === 0
    ) {

      message.textContent =
        "❌ আগে ছবি নির্বাচন করুন।";

      return;

    }


    uploadButton.disabled =
      true;

    photoInput.disabled =
      true;


    let successCount =
      0;

    let failedCount =
      0;


    try {

      const folderPath =
        getStoragePath();


      for (
        let i = 0;
        i < files.length;
        i++
      ) {

        const file =
          files[i];


        message.textContent =
          "⏳ ছবি " +
          (i + 1) +
          " / " +
          files.length +
          " আপলোড হচ্ছে...";


        const extension =
          getFileExtension(
            file
          );


        const fileName =
          Date.now() +
          "-" +
          String(
            i + 1
          ).padStart(
            3,
            "0"
          ) +
          "-" +
          Math.random()
            .toString(36)
            .substring(
              2,
              8
            ) +
          "." +
          extension;


        const storagePath =
          folderPath
            ? folderPath +
              "/" +
              fileName
            : fileName;


        const { error } =
          await supabaseClient
            .storage
            .from("photos")
            .upload(
              storagePath,
              file,
              {
                upsert:
                  false,

                contentType:
                  file.type ||
                  "image/jpeg"
              }
            );


        if (error) {

          console.error(
            "Upload error:",
            error
          );

          failedCount++;

        } else {

          successCount++;

        }

      }


      if (
        successCount > 0 &&
        failedCount === 0
      ) {

        message.textContent =
          "✅ " +
          successCount +
          "টি ছবি সফলভাবে পোস্ট হয়েছে!";

      } else if (
        successCount > 0 &&
        failedCount > 0
      ) {

        message.textContent =
          "⚠️ " +
          successCount +
          "টি ছবি পোস্ট হয়েছে, " +
          failedCount +
          "টি হয়নি।";

      } else {

        message.textContent =
          "❌ কোনো ছবি পোস্ট হয়নি।";

      }


      photoInput.value =
        "";

      previewArea.innerHTML =
        "";


      await loadPhotos();


    } catch (error) {

      console.error(error);

      message.textContent =
        "❌ ছবি পোস্ট হয়নি: " +
        error.message;

    }


    uploadButton.disabled =
      false;

    photoInput.disabled =
      false;

  }
);

/* =========================
   ADD LIKE
========================= */

async function addLike(
  photoName,
  button
) {

  if (
    button.disabled
  ) {

    return;

  }


  button.disabled =
    true;


  try {

    const {
      data: oldData,
      error: readError
    } =
      await supabaseClient
        .from("photo_likes")
        .select(
          "like_count"
        )
        .eq(
          "photo_name",
          photoName
        )
        .maybeSingle();


    if (readError) {

      console.error(
        "Like read error:",
        readError
      );

      button.textContent =
        "❌ Like হয়নি";

      return;

    }


    if (!oldData) {

      const { error } =
        await supabaseClient
          .from("photo_likes")
          .insert({
            photo_name:
              photoName,

            like_count:
              1
          });


      if (error) {

        console.error(
          "Like insert error:",
          error
        );

        button.textContent =
          "❌ Like হয়নি";

        return;

      }


      button.textContent =
        "❤️ 1";


      button.classList.add(
        "liked"
      );


    } else {

      const newCount =
        Number(
          oldData.like_count || 0
        ) + 1;


      const { error } =
        await supabaseClient
          .from("photo_likes")
          .update({
            like_count:
              newCount
          })
          .eq(
            "photo_name",
            photoName
          );


      if (error) {

        console.error(
          "Like update error:",
          error
        );

        button.textContent =
          "❌ Like হয়নি";

        return;

      }


      button.textContent =
        "❤️ " +
        newCount;


      button.classList.add(
        "liked"
      );

    }


  } finally {

    button.disabled =
      false;

  }

}

  viewerImage.src =
    data.publicUrl;


  loadViewerLike(
    fullPath
  );

}


async function loadViewerLike(
  photoName
) {

  const { data } =
    await supabaseClient
      .from("photo_likes")
      .select(
        "like_count"
      )
      .eq(
        "photo_name",
        photoName
      )
      .maybeSingle();


  const count =
    data
      ? Number(
          data.like_count || 0
        )
      : 0;


  viewerLike.textContent =
    "❤️ " +
    count;

}


async function likeCurrentImage() {

  const file =
    currentImages[
      currentViewerIndex
    ];


  if (!file) {

    return;

  }


  const folderPath =
    getStoragePath();


  const fullPath =
    folderPath
      ? folderPath +
        "/" +
        file.name
      : file.name;


  await addLike(
    fullPath,
    viewerLike
  );

}


function previousImage() {

  if (
    !currentImages.length
  ) {

    return;

  }


  currentViewerIndex--;


  if (
    currentViewerIndex < 0
  ) {

    currentViewerIndex =
      currentImages.length - 1;

  }


  showViewerImage();

}


function nextImage() {

  if (
    !currentImages.length
  ) {

    return;

  }


  currentViewerIndex++;


  if (
    currentViewerIndex >=
    currentImages.length
  ) {

    currentViewerIndex =
      0;

  }


  showViewerImage();

}


/* =========================
   SWIPE
========================= */

let touchStartX =
  0;

let touchEndX =
  0;


viewerImage.addEventListener(
  "touchstart",
  function(event) {

    touchStartX =
      event.changedTouches[0]
        .screenX;

  },
  {
    passive: true
  }
);


viewerImage.addEventListener(
  "touchend",
  function(event) {

    touchEndX =
      event.changedTouches[0]
        .screenX;


    const difference =
      touchEndX -
      touchStartX;


    if (
      Math.abs(difference) < 50
    ) {

      return;

    }


    if (
      difference > 0
    ) {

      previousImage();

    } else {

      nextImage();

    }

  },
  {
    passive: true
  }
);


/* =========================
   START APP
========================= */

async function startApp() {

  const {
    data: sessionData
  } =
    await supabaseClient
      .auth
      .getSession();


  currentUser =
    sessionData.session
      ? sessionData.session.user
      : null;


  isAdmin =
    checkAdmin(
      currentUser
    );


  if (
    currentUser &&
    !isAdmin
  ) {

    await supabaseClient.auth
      .signOut();

    currentUser =
      null;

    isAdmin =
      false;

  }


  updateAdminUI();


  const foldersLoaded =
    await loadFolders();


  if (foldersLoaded) {

    await loadPhotos();

  }

}


startApp();

</script>
