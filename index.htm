<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Picture Post</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}

body{
font-family:Arial,sans-serif;
background:radial-gradient(circle at top,#29230f 0%,#111 38%,#070707 100%);
color:#eee;
}

button{
border:1px solid #806719;
border-radius:6px;
padding:5px 7px;
font-size:10px;
cursor:pointer;
background:#171717;
color:#e8c957;
transition:.15s;
}

button:active{transform:scale(.96)}
button:disabled{opacity:.55;cursor:not-allowed}

header{
background:linear-gradient(135deg,#080808,#211b0b);
color:#fff;
text-align:center;
padding:8px 6px;
position:sticky;
top:0;
z-index:20;
border-bottom:1px solid #b89529;
box-shadow:0 3px 18px rgba(0,0,0,.55);
}

header h1{
margin:0;
font-size:18px;
color:#e5c557;
}

header p{
margin:2px 0 5px;
color:#aaa;
font-size:9px;
}

.auth-area{
display:flex;
justify-content:center;
gap:4px;
flex-wrap:wrap;
}

.auth-button{
background:#141414;
color:#e7c650;
border:1px solid #6d571b;
padding:6px 12px;
border-radius:6px;
font-size:10px;
min-width:100px;
}

.admin-status{
display:none;
color:#d4af37;
font-size:8px;
margin-top:3px;
}

.member-area{
display:flex;
justify-content:center;
align-items:center;
gap:5px;
margin-top:5px;
}

.member-count{
background:#151515;
color:#d8c36b;
border:1px solid #5c4c1c;
border-radius:6px;
padding:5px 9px;
font-size:9px;
min-width:90px;
text-align:center;
}

.join-button{
background:linear-gradient(135deg,#8e6d18,#d4af37);
color:#111;
border:0;
padding:5px 11px;
min-width:90px;
font-size:9px;
font-weight:bold;
}

.join-button.joined{
background:#18351f;
color:#79dc91;
border:1px solid #3e7d4d;
}

.container{
width:100%;
max-width:700px;
margin:auto;
padding:5px;
}

.top-buttons{
display:flex;
justify-content:center;
gap:6px;
margin-bottom:5px;
}

.top-buttons button{
min-width:105px;
background:#171717;
color:#d9bd55;
border:1px solid #6d571b;
padding:6px 14px;
font-size:10px;
}

.box{
background:rgba(20,20,20,.96);
padding:7px;
border-radius:8px;
margin-bottom:6px;
border:1px solid #3d341c;
box-shadow:0 2px 12px rgba(0,0,0,.35);
}

.box h2{
margin:0 0 5px;
font-size:12px;
color:#e0c45a;
}

#currentFolder{
color:#999;
font-size:8px;
margin-bottom:5px;
word-break:break-word;
}

.folder-actions{
display:flex;
justify-content:center;
gap:5px;
margin-bottom:5px;
}

.folder-actions button{
min-width:105px;
background:#171717;
color:#d7ba4f;
border:1px solid #5d4d19;
padding:5px 9px;
font-size:8px;
}

.folders{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:3px;
}

.folder{
background:linear-gradient(145deg,#1b1b1b,#101010);
padding:2px;
border-radius:5px;
border:1px solid #40371b;
min-width:0;
}

.folder-open{
width:100%;
background:transparent;
border:0;
padding:2px 1px;
text-align:center;
color:#ddd;
}

.folder-icon{
display:block;
font-size:13px;
line-height:14px;
}

.folder-name{
display:block;
font-size:7px;
line-height:9px;
font-weight:bold;
word-break:break-word;
color:#d8c77c;
}

.folder-manage{
display:flex;
gap:1px;
margin-top:2px;
}

.folder-manage button{
flex:1;
padding:2px 0;
font-size:5px;
line-height:7px;
}

.rename-button{
background:#211e12;
color:#d7bb54;
}

.delete-button{
background:#251313;
color:#ef7777;
}

.join-lock{
text-align:center;
padding:18px 8px;
border:1px solid #4d411d;
border-radius:7px;
background:linear-gradient(145deg,#181818,#101010);
grid-column:1/-1;
}

.join-lock-icon{font-size:25px;margin-bottom:5px}
.join-lock-title{color:#e1c45b;font-size:12px;font-weight:bold;margin-bottom:4px}
.join-lock-text{color:#999;font-size:9px;line-height:14px;margin-bottom:8px}

.join-lock-button{
background:linear-gradient(135deg,#92701b,#d6b33e);
color:#111;
border:0;
font-size:9px;
font-weight:bold;
padding:7px 13px;
}

input[type=file]{
width:auto;
max-width:100%;
display:block;
margin:5px 0;
font-size:9px;
color:#aaa;
background:#111;
border:1px solid #4b4328;
border-radius:6px;
padding:5px 7px;
}

#previewArea{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:3px;
margin:4px 0;
}

.preview-item{
position:relative;
background:#111;
border-radius:5px;
overflow:hidden;
aspect-ratio:1/1;
border:1px solid #443b20;
}

.preview-item img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.preview-number{
position:absolute;
left:2px;
top:2px;
background:rgba(0,0,0,.8);
color:#f0cc58;
padding:1px 3px;
border-radius:3px;
font-size:6px;
}

#uploadButton{
width:auto;
min-width:125px;
display:block;
margin:7px auto 2px;
background:linear-gradient(135deg,#9a7617,#d7b53d);
color:#0c0c0c;
border:0;
padding:7px 15px;
font-size:10px;
font-weight:bold;
}

#message{
text-align:center;
margin-top:4px;
font-size:8px;
font-weight:bold;
word-break:break-word;
color:#d3b94e;
}

.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:4px;
}

.photo-card{
background:#111;
border-radius:7px;
overflow:hidden;
border:1px solid #3e3825;
box-shadow:0 2px 8px rgba(0,0,0,.4);
position:relative;
}

.photo-number{
position:absolute;
top:3px;
left:3px;
z-index:5;
background:rgba(0,0,0,.78);
color:#f0cc58;
padding:1px 4px;
border-radius:4px;
font-size:7px;
font-weight:bold;
}

.photo-card img{
width:100%;
height:145px;
object-fit:cover;
display:block;
cursor:pointer;
}

.photo-info{padding:3px}

.like-button{
width:100%;
background:#171717;
color:#aaa;
border:1px solid #443f31;
margin-bottom:2px;
padding:4px;
font-size:8px;
}

.like-button.liked{
background:#32151c;
color:#ff6575;
border-color:#803746;
}

.photo-delete-button{
width:100%;
background:#291313;
color:#ee7777;
border:1px solid #713535;
padding:4px;
font-size:8px;
}

.empty{
text-align:center;
color:#777;
padding:12px 5px;
grid-column:1/-1;
font-size:9px;
}

#loginModal{
position:fixed;
inset:0;
background:rgba(0,0,0,.82);
z-index:200;
display:none;
align-items:center;
justify-content:center;
padding:10px;
}

.login-box{
width:100%;
max-width:330px;
background:#171717;
border:1px solid #a88929;
border-radius:10px;
padding:12px;
box-shadow:0 5px 30px rgba(0,0,0,.7);
}

.login-box h2{
margin:0 0 9px;
text-align:center;
color:#e2c454;
font-size:15px;
}

.login-box input{
width:100%;
padding:8px;
margin-bottom:5px;
background:#0d0d0d;
color:#eee;
border:1px solid #4b4328;
border-radius:6px;
font-size:11px;
outline:none;
}

.login-submit{
width:100%;
background:#d4af37;
color:#111;
border:0;
padding:7px;
font-size:10px;
font-weight:bold;
}

.login-close{
width:100%;
background:#222;
color:#aaa;
border:1px solid #444;
margin-top:4px;
padding:6px;
font-size:9px;
}

#loginMessage{
text-align:center;
font-size:9px;
margin-top:5px;
word-break:break-word;
color:#d2b54c;
}

#viewer{
position:fixed;
inset:0;
background:rgba(0,0,0,.97);
z-index:100;
display:none;
flex-direction:column;
}

.viewer-top{
display:flex;
justify-content:space-between;
align-items:center;
padding:6px;
}

.viewer-top button{
background:#191919;
color:#e8c957;
border:1px solid #5d4d1c;
padding:5px 7px;
font-size:9px;
}

.viewer-stage{
position:relative;
flex:1;
min-height:0;
display:flex;
align-items:center;
justify-content:center;
}

#viewerImage{
width:100%;
height:100%;
object-fit:contain;
min-height:0;
padding:5px 38px;
}

.viewer-arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
z-index:5;
width:31px;
height:45px;
border-radius:8px;
background:rgba(255,255,255,.1);
color:#f0cc58;
border:1px solid rgba(220,180,60,.35);
font-size:20px;
padding:0;
}

.viewer-prev{left:4px}
.viewer-next{right:4px}

.viewer-bottom{
display:flex;
justify-content:center;
padding:6px;
}

#viewerLike{
background:#751c2c;
color:#fff;
border:1px solid #a8384b;
min-width:90px;
padding:6px 9px;
font-size:9px;
}

@media(max-width:420px){

.container{padding:4px}
.box{padding:6px;margin-bottom:5px}
.box h2{font-size:11px;margin-bottom:4px}

.member-area{gap:4px;margin-top:4px}

.member-count,
.join-button{
font-size:8px;
padding:5px 8px;
min-width:82px;
}

.top-buttons{gap:5px}

.top-buttons button{
min-width:100px;
padding:6px 12px;
font-size:9px;
}

.folder-actions{gap:4px}

.folder-actions button{
min-width:100px;
padding:5px 8px;
font-size:8px;
}

.folders{grid-template-columns:repeat(4,1fr);gap:2px}

.folder-icon{font-size:13px}
.folder-name{font-size:6.5px;line-height:8px}

.folder-manage button{
font-size:5px;
padding:2px 0;
}

input[type=file]{
font-size:8px;
padding:4px 6px;
}

#uploadButton{
min-width:120px;
padding:6px 13px;
font-size:9px;
}

#previewArea{
grid-template-columns:repeat(4,1fr);
gap:2px;
}

.gallery{gap:3px}

.photo-card img{height:130px}

.like-button,
.photo-delete-button{
padding:3px;
font-size:7px;
}

#viewerImage{
padding-left:35px;
padding-right:35px;
}

.viewer-arrow{
width:29px;
height:42px;
font-size:18px;
}

.join-lock{padding:15px 6px}
}

@media(max-width:360px){

.top-buttons button{
min-width:90px;
padding:5px 10px;
font-size:8px;
}

.folder-actions button{
min-width:95px;
font-size:7px;
}

#uploadButton{
min-width:110px;
font-size:8px;
}

.member-count,
.join-button{
min-width:75px;
font-size:7px;
}

}
</style>
</head>

<body>

<header>

<h1>📸 Picture Post</h1>
<p>ছবি শেয়ার করার সহজ জায়গা</p>

<div class="auth-area">

<button id="loginButton"
class="auth-button"
onclick="openLogin()">
🔐 Admin Login
</button>

<button id="logoutButton"
class="auth-button"
onclick="logoutAdmin()"
style="display:none">
🚪 Logout
</button>

</div>

<div id="adminStatus"
class="admin-status">
👑 Admin Mode চালু
</div>

<div class="member-area">

<div id="memberCount"
class="member-count">
👥 Member: ...
</div>

<button id="joinButton"
class="join-button"
onclick="joinWebsite()">
🤝 Join করুন
</button>

</div>

</header>

<div class="container">

<div class="top-buttons">

<button onclick="goHome()">
🏠 Home
</button>

<button onclick="goBack()">
⬅️ Back
</button>

</div>


<div class="box">

<h2>📁 Picture Folder</h2>

<div id="currentFolder">
📁 Home
</div>

<div id="adminFolderActions"
class="folder-actions"
style="display:none">

<button onclick="createFolder()">
➕ নতুন Folder
</button>

<button onclick="refreshAll()">
🔄 Refresh
</button>

</div>

<div id="publicRefreshArea"
class="folder-actions">

<button onclick="refreshAll()">
🔄 Refresh
</button>

</div>

<div id="folders"
class="folders">

<div class="empty">
⏳ Folder লোড হচ্ছে...
</div>

</div>

</div>


<div id="adminUploadBox"
class="box"
style="display:none">

<h2>📤 ছবি পোস্ট করুন</h2>

<input
type="file"
id="photoInput"
accept="image/*"
multiple>

<div id="previewArea"></div>

<button id="uploadButton">
📤 ছবি পোস্ট করুন
</button>

<div id="message"></div>

</div>


<div class="box">

<h2>🖼️ পোস্ট করা ছবি</h2>

<div id="gallery" class="gallery">

<div class="empty">
ছবি লোড হচ্ছে...
</div>

</div>

</div>

</div>


<div id="loginModal">

<div class="login-box">

<h2>🔐 Admin Login</h2>

<input
type="email"
id="loginEmail"
placeholder="Admin Email"
autocomplete="off">

<input
type="password"
id="loginPassword"
placeholder="Password"
autocomplete="current-password">

<button
id="loginSubmit"
class="login-submit"
onclick="loginAdmin()">
🔐 Login
</button>

<button
class="login-close"
onclick="closeLogin()">
✕ বন্ধ
</button>

<div id="loginMessage"></div>

</div>

</div>


<div id="viewer">

<div class="viewer-top">

<button onclick="closeViewer()">
✕ বন্ধ
</button>

<button onclick="goHome();closeViewer()">
🏠 Home
</button>

</div>

<div class="viewer-stage">

<button
class="viewer-arrow viewer-prev"
onclick="previousImage()">
‹
</button>

<img
id="viewerImage"
alt="Picture">

<button
class="viewer-arrow viewer-next"
onclick="nextImage()">
›
</button>

</div>

<div class="viewer-bottom">

<button
id="viewerLike"
onclick="likeCurrentImage()">
❤️ 0
</button>

</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://vhqiqbapbxwmvycxrsvc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CIj1SRMGjbByiTkx-Yx8Eg_g7jHkTh9";

const ADMIN_EMAIL =
"prince.masud.ak46@gmail.com";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   ELEMENTS
===================================================== */

const photoInput =
document.getElementById("photoInput");

const previewArea =
document.getElementById("previewArea");

const uploadButton =
document.getElementById("uploadButton");

const message =
document.getElementById("message");

const gallery =
document.getElementById("gallery");

const folders =
document.getElementById("folders");

const currentFolder =
document.getElementById("currentFolder");

const viewer =
document.getElementById("viewer");

const viewerImage =
document.getElementById("viewerImage");

const viewerLike =
document.getElementById("viewerLike");

const loginModal =
document.getElementById("loginModal");

const loginEmail =
document.getElementById("loginEmail");

const loginPassword =
document.getElementById("loginPassword");

const loginSubmit =
document.getElementById("loginSubmit");

const loginMessage =
document.getElementById("loginMessage");

const loginButton =
document.getElementById("loginButton");

const logoutButton =
document.getElementById("logoutButton");

const adminStatus =
document.getElementById("adminStatus");

const adminFolderActions =
document.getElementById("adminFolderActions");

const publicRefreshArea =
document.getElementById("publicRefreshArea");

const adminUploadBox =
document.getElementById("adminUploadBox");

const memberCount =
document.getElementById("memberCount");

const joinButton =
document.getElementById("joinButton");


/* =====================================================
   STATE
===================================================== */

let currentUser=null;
let isAdmin=false;
let isMember=false;

let allFolders=[];
let currentFolderId=null;

let currentImages=[];
let currentViewerIndex=0;

let loadingPhotos=false;
let photoLoadNumber=0;

const FOLDER_STORAGE_KEY=
"picture_post_current_folder";

const LOCAL_LIKE_KEY=
"picture_post_local_likes";


/* =====================================================
   ADMIN
===================================================== */

function checkAdmin(user){

return !!user &&
String(user.email||"")
.toLowerCase()
.trim()===
ADMIN_EMAIL.toLowerCase().trim();

}


function updateAdminUI(){

if(isAdmin){

loginButton.style.display="none";
logoutButton.style.display="inline-block";

adminStatus.style.display="block";

adminFolderActions.style.display="flex";
publicRefreshArea.style.display="none";

adminUploadBox.style.display="block";

}else{

loginButton.style.display="inline-block";
logoutButton.style.display="none";

adminStatus.style.display="none";

adminFolderActions.style.display="none";
publicRefreshArea.style.display="flex";

adminUploadBox.style.display="none";

}

}


function requireAdmin(){

if(!isAdmin){

alert("🔒 এই কাজটি শুধু Admin করতে পারবেন.");

return false;

}

return true;

}


/* =====================================================
   AUTH
===================================================== */

supabaseClient.auth.onAuthStateChange(
function(event,session){

currentUser=
session ? session.user : null;

isAdmin=
checkAdmin(currentUser);

updateAdminUI();

}
);


async function ensureAnonymousSession(){

const {
data,
error
}=
await supabaseClient.auth.getSession();

if(error){

console.error(error);
return false;

}

if(data.session){

currentUser=data.session.user;

isAdmin=
checkAdmin(currentUser);

updateAdminUI();

return true;

}


const {
data:authData,
error:authError
}=
await supabaseClient.auth.signInAnonymously();


if(authError){

console.error(authError);

return false;

}

currentUser=authData.user;

isAdmin=
checkAdmin(currentUser);

updateAdminUI();

return true;

}


function openLogin(){

loginModal.style.display="flex";

loginMessage.textContent="";
loginEmail.value="";
loginPassword.value="";

setTimeout(
()=>loginEmail.focus(),
100
);

}


function closeLogin(){

loginModal.style.display="none";
loginMessage.textContent="";

}


async function loginAdmin(){

const email=
loginEmail.value.trim();

const password=
loginPassword.value;

if(!email){

loginMessage.textContent="❌ Email দিন.";
return;

}

if(!password){

loginMessage.textContent="❌ Password দিন.";
return;

}

if(
email.toLowerCase()!==
ADMIN_EMAIL.toLowerCase()
){

loginMessage.textContent="❌ এই Email Admin নয়.";
return;

}

loginSubmit.disabled=true;

loginMessage.textContent=
"⏳ Admin Login হচ্ছে...";


await supabaseClient.auth.signOut();


const {
data,
error
}=
await supabaseClient.auth.signInWithPassword({
email,
password
});


if(error){

loginMessage.textContent=
"❌ Login হয়নি: "+error.message;

loginSubmit.disabled=false;

await ensureAnonymousSession();

return;

}


currentUser=data.user;

isAdmin=checkAdmin(currentUser);

if(!isAdmin){

await supabaseClient.auth.signOut();
await ensureAnonymousSession();

loginMessage.textContent=
"❌ এই account Admin নয়.";

loginSubmit.disabled=false;

return;

}


updateAdminUI();

closeLogin();

message.textContent=
"👑 Admin Mode চালু হয়েছে.";

await loadFolders();
await loadPhotos();

loginSubmit.disabled=false;

}


async function logoutAdmin(){

if(!confirm("🚪 Admin Logout করবেন?")){
return;
}

await supabaseClient.auth.signOut();

currentUser=null;
isAdmin=false;
isMember=false;

updateAdminUI();

await ensureAnonymousSession();

await checkMemberStatus();

message.textContent=
"✅ Admin Logout হয়েছে.";

await loadFolders();
await loadPhotos();

}


/* =====================================================
   MEMBER
===================================================== */

async function checkMemberStatus(){

if(isAdmin){

isMember=true;
updateJoinButton();

return true;

}

if(!currentUser){

isMember=false;
updateJoinButton();

return false;

}

const {
data,
error
}=
await supabaseClient
.from("members")
.select("id")
.eq("user_id",currentUser.id)
.maybeSingle();

isMember=
!error && !!data;

updateJoinButton();

return isMember;

}


function updateJoinButton(){

if(isMember || isAdmin){

joinButton.textContent=
isAdmin ? "👑 Admin" : "✅ Joined";

joinButton.classList.add("joined");
joinButton.disabled=true;

}else{

joinButton.textContent="🤝 Join করুন";

joinButton.classList.remove("joined");
joinButton.disabled=false;

}

}


async function joinWebsite(){

if(isAdmin || isMember){
return;
}

joinButton.disabled=true;
joinButton.textContent="⏳ Joining...";


try{

if(!currentUser){

const ok=
await ensureAnonymousSession();

if(!ok){
throw new Error("Anonymous session তৈরি হয়নি.");
}

}


const {
data:existing,
error:checkError
}=

function getCurrentPath(){

if(!currentFolderId){
return [];
}

const result=[];

let id=currentFolderId;

while(id){

const folder=
allFolders.find(
x=>x.id===id
);

if(!folder){
break;
}

result.unshift(folder.name);

id=folder.parent_id;

}

return result;

}


function getFolderStoragePath(folderId){

if(!folderId){
return "";
}

const parts=[];

let id=folderId;

while(id){

const folder=
allFolders.find(
x=>x.id===id
);

if(!folder){
break;
}

parts.unshift(
"folder_"+folder.id
);

id=folder.parent_id;

}

return parts.join("/");

}


function getStoragePath(){

return getFolderStoragePath(
currentFolderId
);

}

);

);

});

}

error
}=
await supabaseClient
.storage
.from("photos")
.list(

{limit:1000}
);

return null;
}

const files=[];

for(const item of data||[]){

path
?
path+"/"+item.name
:

files.push(...child);

function getFileExtension(file){

const name=file.name||"";

const dot=name.lastIndexOf(".");

if(dot!==-1){

const ext=
name.substring(dot+1)
.toLowerCase()
.replace(/[^a-z0-9]/g,"");

if(ext){
return ext;
}

}

return "jpg";

}


async function addWatermark(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=e=>{

const img=new Image();

img.onload=()=>{

const canvas=
document.createElement("canvas");

const ctx=
canvas.getContext("2d");

canvas.width=img.naturalWidth;
canvas.height=img.naturalHeight;

ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);


const base=
Math.min(
canvas.width,
canvas.height
);

const fontSize=
Math.max(
24,
Math.round(base*.055)
);


ctx.font=
"bold "+fontSize+"px Arial";

ctx.textAlign="center";
ctx.textBaseline="middle";


const text="© Picture Post";

const metrics=
ctx.measureText(text);

const px=fontSize*.45;
const py=fontSize*.25;

const boxWidth=
metrics.width+px*2;

const boxHeight=
fontSize+py*2;

const x=canvas.width/2;
const y=canvas.height/2;


ctx.fillStyle=
"rgba(0,0,0,.28)";

ctx.fillRect(
x-boxWidth/2,
y-boxHeight/2,
boxWidth,
boxHeight
);


ctx.fillStyle=
"rgba(231,197,80,.68)";

ctx.strokeStyle=
"rgba(0,0,0,.45)";

ctx.lineWidth=
Math.max(1,fontSize*.04);


ctx.strokeText(text,x,y);
ctx.fillText(text,x,y);


canvas.toBlob(
blob=>{

if(!blob){

reject(
new Error("Watermark তৈরি করা যায়নি।")
);

return;

}


resolve(
new File(
[blob],
file.name.replace(
/\.[^/.]+$/,
""
)+".jpg",
{
type:"image/jpeg",
lastModified:Date.now()
}
)
);

},
"image/jpeg",
.92
);

};


img.onerror=
()=>reject(
new Error("ছবিটি পড়া যায়নি।")
);

img.src=e.target.result;

};


reader.onerror=
()=>reject(
new Error("ছবি পড়া যায়নি।")
);

reader.readAsDataURL(file);

}

/* =====================================================
   FAST PHOTO LOADING
===================================================== */

/*
   এখানে আগের সবচেয়ে ধীর অংশটি ঠিক করা হয়েছে।

   আগে:
   ছবি ১ -> Signed URL
   ছবি ২ -> Signed URL
   ছবি ৩ -> Signed URL
   ছবি ৪ -> Signed URL
   ...

   এখন:
   সব ছবির path একসাথে নিয়ে
   একটি batch Signed URL request করা হচ্ছে।
*/


async function createBatchSignedUrls(paths){

if(!paths.length){
return {};
}


const {
data,
error
}=
await supabaseClient
.storage
.from("photos")
.createSignedUrls(
paths,
3600
);


if(error){

console.error(
"Batch signed URL error:",
error
);

return {};
}


const result={};


(data||[]).forEach(
(item,index)=>{

if(item.signedUrl){

result[
paths[index]
]=item.signedUrl;

}

}
);


return result;

}

function getLocalLikes(){

try{

return JSON.parse(
localStorage.getItem(
LOCAL_LIKE_KEY
)||"{}"
);

}catch(e){

return {};

}

}


function saveLocalLikes(data){

try{

localStorage.setItem(
LOCAL_LIKE_KEY,
JSON.stringify(data)
);

}catch(e){}

}


function getLocalLike(name){

const likes=
getLocalLikes();

return Number(likes[name]||0);

}


function addLocalLike(name){

const likes=
getLocalLikes();

likes[name]=
Number(likes[name]||0)+1;

saveLocalLikes(likes);

return likes[name];

}

}

   DELETE PHOTO
===================================================== */

async function deletePhoto(
fullPath,
card
){

if(!requireAdmin()){
return;
}

if(!confirm(
"🗑️ এই ছবিটি Delete করবেন?"
)){
return;
}


const button=
card.querySelector(
".photo-delete-button"
);

if(button){

button.disabled=true;
button.textContent="⏳ Delete হচ্ছে...";

}


const {
error
}=
await supabaseClient
.storage
.from("photos")
.remove([fullPath]);


if(error){

alert(
"❌ ছবি Delete হয়নি: "+error.message
);

if(button){

button.disabled=false;
button.textContent="🗑️ Delete";

}

return;

}


await supabaseClient
.from("photo_likes")
.delete()
.eq("photo_name",fullPath);


message.textContent=
"✅ ছবি Delete হয়েছে.";

closeViewer();

await loadPhotos();

}


/* =====================================================
   VIEWER
===================================================== */

async function openViewer(index){

if(!isAdmin){

const memberOK=
await checkMemberStatus();

if(!memberOK){

alert("🔒 ছবি দেখতে আগে Join করুন.");

return;

}

}


if(!currentImages.length){
return;
}


currentViewerIndex=index;

viewer.style.display="flex";

await showViewerImage();

}


function closeViewer(){

viewer.style.display="none";

viewerImage.removeAttribute("src");

}


async function showViewerImage(){

const file=
currentImages[currentViewerIndex];

if(!file){
return;
}


const folderPath=
getStoragePath();

const fullPath=
folderPath
?
folderPath+"/"+file.name
:
file.name;


/*
   Viewer-এ নতুন request না করে
   Gallery-এর image URL ব্যবহার করা হবে।
*/

const images=
gallery.querySelectorAll(
".photo-card img"
);

if(images[currentViewerIndex]){

viewerImage.src=
images[currentViewerIndex].src;

}else{

const map=
await createBatchSignedUrls([fullPath]);

if(map[fullPath]){

viewerImage.src=map[fullPath];

}

}


await loadViewerLike(fullPath);

}


async function loadViewerLike(photoName){

const {
data,
error
}=
await supabaseClient
.from("photo_likes")
.select("like_count")
.eq("photo_name",photoName)
.maybeSingle();


let count=0;

if(!error && data){

count=
Number(data.like_count||0);

}else{

count=
getLocalLike(photoName);

}


viewerLike.textContent=
"❤️ "+count;

}


async function likeCurrentImage(){

const file=
currentImages[currentViewerIndex];

if(!file){
return;
}


const folderPath=
getStoragePath();

const fullPath=
folderPath
?
folderPath+"/"+file.name
:
file.name;


await addLike(
fullPath,
viewerLike
);


}


/* =====================================================
   NEXT / PREVIOUS
===================================================== */

function previousImage(){

if(!currentImages.length){
return;
}

currentViewerIndex--;

if(currentViewerIndex<0){

currentViewerIndex=
currentImages.length-1;

}

showViewerImage();

}


function nextImage(){

if(!currentImages.length){
return;
}

currentViewerIndex++;

if(
currentViewerIndex>=
currentImages.length
){

currentViewerIndex=0;

}

showViewerImage();

}


/* =====================================================
   SWIPE
===================================================== */

let touchStartX=0;

viewerImage.addEventListener(
"touchstart",
event=>{

touchStartX=
event.changedTouches[0].screenX;

},
{passive:true}
);


viewerImage.addEventListener(
"touchend",
event=>{

const endX=
event.changedTouches[0].screenX;

const difference=
endX-touchStartX;

if(Math.abs(difference)<50){
return;
}

if(difference>0){

previousImage();

}else{

nextImage();

}

},
{passive:true}
);

   HELPERS
===================================================== */

function escapeHtml(text){

const div=
document.createElement("div");

div.textContent=text;

return div.innerHTML;

}

}

updateJoinButton();

memberCount.textContent=

const ok=

if(!ok){

isAdmin=
checkAdmin(currentUser);

await loadMemberCount();

await loadPhotos();

}


startApp();
