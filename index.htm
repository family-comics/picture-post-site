<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Picture Post</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top,#29230f 0%,#111 38%,#070707 100%);
  color:#eee;
}

button{
  box-sizing:border-box;
  border:1px solid #806719;
  border-radius:6px;
  padding:5px 7px;
  font-size:10px;
  cursor:pointer;
  background:#171717;
  color:#e8c957;
  transition:.15s;
}

button:active{
  transform:scale(.96);
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}


/* =========================
   HEADER
========================= */

header{
  background:
    linear-gradient(135deg,#080808,#211b0b);
  color:#fff;
  text-align:center;
  padding:8px 6px;
  position:sticky;
  top:0;
  z-index:20;
  border-bottom:1px solid #b89529;
  box-shadow:0 3px 18px rgba(0,0,0,.55);
}

header h1{
  margin:0;
  font-size:18px;
  color:#e5c557;
}

header p{
  margin:2px 0 5px;
  color:#aaa;
  font-size:9px;
}

.auth-area{
  display:flex;
  justify-content:center;
  gap:4px;
  flex-wrap:wrap;
}

.auth-button{
  background:#141414;
  color:#e7c650;
  border:1px solid #6d571b;
  padding:6px 12px;
  border-radius:6px;
  font-size:10px;
  width:auto;
  min-width:100px;
}

.admin-status{
  display:none;
  color:#d4af37;
  font-size:8px;
  margin-top:3px;
}


/* =========================
   MAIN
========================= */

.container{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:5px;
}


/* =========================
   TOP BUTTONS
========================= */

.top-buttons{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  margin-bottom:5px;
}

.top-buttons button{
  flex:0 0 auto;
  width:auto;
  min-width:105px;
  background:#171717;
  color:#d9bd55;
  border:1px solid #6d571b;
  padding:6px 14px;
  font-size:10px;
  border-radius:6px;
  box-shadow:0 2px 7px rgba(0,0,0,.3);
}


/* =========================
   BOX
========================= */

.box{
  background:rgba(20,20,20,.96);
  padding:7px;
  border-radius:8px;
  margin-bottom:6px;
  border:1px solid #3d341c;
  box-shadow:0 2px 12px rgba(0,0,0,.35);
}

.box h2{
  margin:0 0 5px;
  font-size:12px;
  color:#e0c45a;
}

#currentFolder{
  color:#999;
  font-size:8px;
  margin-bottom:5px;
  word-break:break-word;
}


/* =========================
   FOLDER ACTIONS
========================= */

.folder-actions{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  margin-bottom:5px;
}

.folder-actions button{
  flex:0 0 auto;
  width:auto;
  min-width:115px;
  background:#171717;
  color:#d7ba4f;
  border:1px solid #5d4d19;
  padding:6px 12px;
  font-size:9px;
  border-radius:6px;
}


/* =========================
   FOLDERS
========================= */

.folders{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}

.folder{
  background:
    linear-gradient(145deg,#1d1d1d,#111);
  padding:2px;
  border-radius:6px;
  border:1px solid #4b401e;
  min-width:0;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}

.folder-open{
  width:100%;
  background:transparent;
  border:0;
  padding:2px 1px;
  text-align:center;
  color:#ddd;
}

.folder-icon{
  display:block;
  font-size:15px;
  line-height:16px;
  margin-bottom:1px;
}

.folder-name{
  display:block;
  font-size:8px;
  line-height:10px;
  font-weight:bold;
  word-break:break-word;
  color:#d8c77c;
}

.folder-manage{
  display:flex;
  gap:2px;
  margin-top:2px;
}

.folder-manage button{
  flex:1;
  padding:2px 0;
  font-size:6px;
  border-radius:4px;
  white-space:nowrap;
}

.rename-button{
  background:#211e12;
  color:#d7bb54;
  border:1px solid #6b591d;
}

.delete-button{
  background:#251313;
  color:#ef7777;
  border:1px solid #713434;
}


/* =========================
   FILE INPUT
========================= */

input[type=file]{
  width:auto;
  max-width:100%;
  display:block;
  margin:5px 0;
  font-size:9px;
  color:#aaa;
  background:#111;
  border:1px solid #4b4328;
  border-radius:6px;
  padding:5px 7px;
}


/* =========================
   PREVIEW
========================= */

#previewArea{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:3px;
  margin:4px 0;
}

.preview-item{
  position:relative;
  background:#111;
  border-radius:5px;
  overflow:hidden;
  aspect-ratio:1/1;
  border:1px solid #443b20;
}

.preview-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.preview-number{
  position:absolute;
  left:2px;
  top:2px;
  background:rgba(0,0,0,.8);
  color:#f0cc58;
  padding:1px 3px;
  border-radius:3px;
  font-size:6px;
}


/* =========================
   UPLOAD
========================= */

#uploadButton{
  width:auto;
  min-width:125px;
  display:block;
  margin:7px auto 2px;
  background:
    linear-gradient(135deg,#9a7617,#d7b53d);
  color:#0c0c0c;
  border:0;
  padding:7px 15px;
  font-size:10px;
  font-weight:bold;
  border-radius:6px;
}

#message{
  text-align:center;
  margin-top:4px;
  font-size:8px;
  font-weight:bold;
  word-break:break-word;
  color:#d3b94e;
}


/* =========================
   GALLERY
========================= */

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:4px;
}

.photo-card{
  background:#111;
  border-radius:7px;
  overflow:hidden;
  border:1px solid #3e3825;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
  position:relative;
}

.photo-number{
  position:absolute;
  top:3px;
  left:3px;
  z-index:5;
  background:rgba(0,0,0,.78);
  color:#f0cc58;
  padding:1px 4px;
  border-radius:4px;
  font-size:7px;
  font-weight:bold;
}

.photo-card img{
  width:100%;
  height:145px;
  object-fit:cover;
  display:block;
  cursor:pointer;
}

.photo-info{
  padding:3px;
}

.like-button{
  width:100%;
  background:#171717;
  color:#aaa;
  border:1px solid #443f31;
  margin-bottom:2px;
  padding:4px;
  font-size:8px;
}

.like-button.liked{
  background:#32151c;
  color:#ff6575;
  border-color:#803746;
}

.photo-delete-button{
  width:100%;
  background:#291313;
  color:#ee7777;
  border:1px solid #713535;
  padding:4px;
  font-size:8px;
}


/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;
  color:#777;
  padding:12px 5px;
  grid-column:1/-1;
  font-size:9px;
}


/* =========================
   LOGIN
========================= */

#loginModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:10px;
}

.login-box{
  width:100%;
  max-width:330px;
  background:#171717;
  border:1px solid #a88929;
  border-radius:10px;
  padding:12px;
  box-shadow:0 5px 30px rgba(0,0,0,.7);
}

.login-box h2{
  margin:0 0 9px;
  text-align:center;
  color:#e2c454;
  font-size:15px;
}

.login-box input{
  width:100%;
  padding:8px;
  margin-bottom:5px;
  background:#0d0d0d;
  color:#eee;
  border:1px solid #4b4328;
  border-radius:6px;
  font-size:11px;
  outline:none;
}

.login-submit{
  width:100%;
  background:#d4af37;
  color:#111;
  border:0;
  margin-top:2px;
  padding:7px;
  font-size:10px;
  font-weight:bold;
}

.login-close{
  width:100%;
  background:#222;
  color:#aaa;
  border:1px solid #444;
  margin-top:4px;
  padding:6px;
  font-size:9px;
}

#loginMessage{
  text-align:center;
  font-size:9px;
  margin-top:5px;
  word-break:break-word;
  color:#d2b54c;
}


/* =========================
   VIEWER
========================= */

#viewer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.97);
  z-index:100;
  display:none;
  flex-direction:column;
}

.viewer-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px;
  flex-shrink:0;
}

.viewer-top button{
  background:#191919;
  color:#e8c957;
  border:1px solid #5d4d1c;
  padding:5px 7px;
  font-size:9px;
}

.viewer-stage{
  position:relative;
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

#viewerImage{
  width:100%;
  height:100%;
  object-fit:contain;
  min-height:0;
  padding:5px 38px;
}

.viewer-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:5;
  width:31px;
  height:45px;
  border-radius:8px;
  background:rgba(255,255,255,.1);
  color:#f0cc58;
  border:1px solid rgba(220,180,60,.35);
  font-size:20px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.viewer-prev{left:4px}
.viewer-next{right:4px}

.viewer-bottom{
  display:flex;
  justify-content:center;
  padding:6px;
  flex-shrink:0;
}

#viewerLike{
  background:#751c2c;
  color:#fff;
  border:1px solid #a8384b;
  min-width:90px;
  padding:6px 9px;
  font-size:9px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:420px){

  .container{
    padding:4px;
  }

  .box{
    padding:6px;
    margin-bottom:5px;
  }

  .box h2{
    font-size:11px;
    margin-bottom:4px;
  }


  /* Home + Back */

  .top-buttons{
    justify-content:center;
    gap:5px;
  }

  .top-buttons button{
    min-width:100px;
    padding:6px 12px;
    font-size:9px;
  }


  /* Folder buttons */

  .folder-actions{
    justify-content:center;
    gap:5px;
  }

  .folder-actions button{
    min-width:105px;
    padding:5px 10px;
    font-size:8px;
  }


  .folders{
    grid-template-columns:repeat(3,1fr);
    gap:2px;
  }

  .folder{
    padding:2px 1px;
  }

  .folder-icon{
    font-size:14px;
    line-height:15px;
  }

  .folder-name{
    font-size:7px;
    line-height:9px;
  }

  .folder-manage{
    gap:1px;
    margin-top:2px;
  }

  .folder-manage button{
    font-size:5.5px;
    padding:2px 0;
  }


  /* File chooser */

  input[type=file]{
    max-width:100%;
    font-size:8px;
    padding:4px 6px;
  }


  /* Upload */

  #uploadButton{
    min-width:120px;
    padding:6px 13px;
    font-size:9px;
  }


  #previewArea{
    grid-template-columns:repeat(4,1fr);
    gap:2px;
  }

  .gallery{
    gap:3px;
  }

  .photo-card img{
    height:130px;
  }

  .like-button,
  .photo-delete-button{
    padding:3px;
    font-size:7px;
  }

  #viewerImage{
    padding-left:35px;
    padding-right:35px;
  }

  .viewer-arrow{
    width:29px;
    height:42px;
    font-size:18px;
  }

}


/* =========================
   EXTRA COMPACT BUTTON FIX
========================= */

@media(max-width:360px){

  .top-buttons button{
    min-width:90px;
    padding:5px 10px;
    font-size:8px;
  }

  .folder-actions button{
    min-width:95px;
    padding:5px 8px;
    font-size:7px;
  }

  #uploadButton{
    min-width:110px;
    padding:6px 10px;
    font-size:8px;
  }

}
</style>
</head>

<body>

<header>

<h1>📸 Picture Post</h1>

<p>ছবি শেয়ার করার সহজ জায়গা</p>

<div class="auth-area">

<button
id="loginButton"
class="auth-button"
onclick="openLogin()">
🔐 Admin Login
</button>

<button
id="logoutButton"
class="auth-button"
onclick="logoutAdmin()"
style="display:none;">
🚪 Logout
</button>

</div>

<div
id="adminStatus"
class="admin-status">
👑 Admin Mode চালু
</div>

</header>


<div class="container">

<div class="top-buttons">

<button onclick="goHome()">
🏠 Home
</button>

<button onclick="goBack()">
⬅️ Back
</button>

</div>


<div class="box">

<h2>📁 Picture Folder</h2>

<div id="currentFolder">
📁 Home
</div>


<div
id="adminFolderActions"
class="folder-actions"
style="display:none;">

<button onclick="createFolder()">
➕ নতুন Folder
</button>

<button onclick="refreshFolders()">
🔄 Refresh
</button>

</div>


<div
id="publicRefreshArea"
class="folder-actions">

<button onclick="refreshFolders()">
🔄 Refresh
</button>

</div>


<div
id="folders"
class="folders">

<div class="empty">
⏳ Folder লোড হচ্ছে...
</div>

</div>

</div>


<div
id="adminUploadBox"
class="box"
style="display:none;">

<h2>📤 ছবি পোস্ট করুন</h2>

<input
type="file"
id="photoInput"
accept="image/*"
multiple>

<div id="previewArea"></div>

<button id="uploadButton">
📤 ছবি পোস্ট করুন
</button>

<div id="message"></div>

</div>


<div class="box">

<h2>🖼️ পোস্ট করা ছবি</h2>

<div
id="gallery"
class="gallery">

<div class="empty">
ছবি লোড হচ্ছে...
</div>

</div>

</div>

</div>


<!-- LOGIN -->

<div id="loginModal">

<div class="login-box">

<h2>🔐 Admin Login</h2>

<input
type="email"
id="loginEmail"
placeholder="Admin Email"
autocomplete="off">

<input
type="password"
id="loginPassword"
placeholder="Password"
autocomplete="current-password">

<button
id="loginSubmit"
class="login-submit"
onclick="loginAdmin()">
🔐 Login
</button>

<button
class="login-close"
onclick="closeLogin()">
✕ বন্ধ
</button>

<div id="loginMessage"></div>

</div>

</div>


<!-- VIEWER -->

<div id="viewer">

<div class="viewer-top">

<button onclick="closeViewer()">
✕ বন্ধ
</button>

<button onclick="goHome();closeViewer();">
🏠 Home
</button>

</div>


<div class="viewer-stage">

<button
class="viewer-arrow viewer-prev"
onclick="previousImage()"
aria-label="Previous">
‹
</button>

<img
id="viewerImage"
alt="Picture">

<button
class="viewer-arrow viewer-next"
onclick="nextImage()"
aria-label="Next">
›
</button>

</div>


<div class="viewer-bottom">

<button
id="viewerLike"
onclick="likeCurrentImage()">
❤️ 0
</button>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://vhqiqbapbxwmvycxrsvc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CIj1SRMGjbByiTkx-Yx8Eg_g7jHkTh9";

const ADMIN_EMAIL =
"prince.masud.ak46@gmail.com";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const photoInput =
document.getElementById("photoInput");

const previewArea =
document.getElementById("previewArea");

const uploadButton =
document.getElementById("uploadButton");

const message =
document.getElementById("message");

const gallery =
document.getElementById("gallery");

const folders =
document.getElementById("folders");

const currentFolder =
document.getElementById("currentFolder");

const viewer =
document.getElementById("viewer");

const viewerImage =
document.getElementById("viewerImage");

const viewerLike =
document.getElementById("viewerLike");

const loginModal =
document.getElementById("loginModal");

const loginEmail =
document.getElementById("loginEmail");

const loginPassword =
document.getElementById("loginPassword");

const loginSubmit =
document.getElementById("loginSubmit");

const loginMessage =
document.getElementById("loginMessage");

const loginButton =
document.getElementById("loginButton");

const logoutButton =
document.getElementById("logoutButton");

const adminStatus =
document.getElementById("adminStatus");

const adminFolderActions =
document.getElementById("adminFolderActions");

const publicRefreshArea =
document.getElementById("publicRefreshArea");

const adminUploadBox =
document.getElementById("adminUploadBox");


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let isAdmin = false;

let allFolders = [];
let currentFolderId = null;
let currentPath = [];
let currentImages = [];
let currentViewerIndex = 0;

const FOLDER_STORAGE_KEY =
"picture_post_current_folder";

const LOCAL_LIKE_KEY =
"picture_post_local_likes";


/* =========================
   ADMIN
========================= */

function checkAdmin(user){

if(!user){
return false;
}

return String(
user.email || ""
).toLowerCase().trim()
===
ADMIN_EMAIL.toLowerCase().trim();

}


function updateAdminUI(){

if(isAdmin){

loginButton.style.display="none";

logoutButton.style.display=
"inline-block";

adminStatus.style.display=
"block";

adminFolderActions.style.display=
"flex";

publicRefreshArea.style.display=
"none";

adminUploadBox.style.display=
"block";

}else{

loginButton.style.display=
"inline-block";

logoutButton.style.display=
"none";

adminStatus.style.display=
"none";

adminFolderActions.style.display=
"none";

publicRefreshArea.style.display=
"flex";

adminUploadBox.style.display=
"none";

}

}


supabaseClient.auth.onAuthStateChange(
function(event,session){

currentUser=
session ? session.user : null;

isAdmin=
checkAdmin(currentUser);

updateAdminUI();

if(currentUser && !isAdmin){

supabaseClient.auth.signOut();

currentUser=null;
isAdmin=false;

updateAdminUI();

alert(
"❌ এই account-এর Admin permission নেই।"
);

}

});


/* =========================
   LOGIN
========================= */

function openLogin(){

loginModal.style.display="flex";

loginMessage.textContent="";

loginEmail.value="";
loginPassword.value="";

setTimeout(
function(){
loginEmail.focus();
},
100
);

}


function closeLogin(){

loginModal.style.display="none";

loginMessage.textContent="";

}


async function loginAdmin(){

const email=
loginEmail.value.trim();

const password=
loginPassword.value;

if(!email){

loginMessage.textContent=
"❌ Email দিন।";

return;
}

if(!password){

loginMessage.textContent=
"❌ Password দিন।";

return;
}

if(
email.toLowerCase() !==
ADMIN_EMAIL.toLowerCase()
){

loginMessage.textContent=
"❌ এই Email Admin নয়।";

return;
}

loginSubmit.disabled=true;

loginMessage.textContent=
"⏳ Login হচ্ছে...";


const {data,error}=
await supabaseClient.auth
.signInWithPassword({
email:email,
password:password
});


if(error){

console.error(
"Login error:",
error
);

loginMessage.textContent=
"❌ Login হয়নি: "+
error.message;

loginSubmit.disabled=false;

return;
}


currentUser=data.user;

isAdmin=
checkAdmin(currentUser);

if(!isAdmin){

await supabaseClient.auth.signOut();

currentUser=null;
isAdmin=false;

updateAdminUI();

loginMessage.textContent=
"❌ এই account Admin নয়।";

loginSubmit.disabled=false;

return;
}


updateAdminUI();

loginMessage.textContent=
"✅ Admin Login সফল হয়েছে!";

setTimeout(
function(){

closeLogin();

message.textContent=
"👑 Admin Mode চালু হয়েছে।";

loadFolders();

loadPhotos();

},
700
);

loginSubmit.disabled=false;

}


async function logoutAdmin(){

const answer=
confirm(
"🚪 Admin Logout করবেন?"
);

if(!answer){
return;
}

await supabaseClient.auth.signOut();

currentUser=null;
isAdmin=false;

updateAdminUI();

message.textContent=
"✅ Admin Logout হয়েছে।";

}


/* =========================
   ADMIN CHECK
========================= */

function requireAdmin(){

if(!isAdmin){

alert(
"🔒 এই কাজটি শুধু Admin করতে পারবেন।"
);

return false;
}

return true;

}


/* =========================
   FOLDER SAVE
========================= */

function saveCurrentFolder(){

if(currentFolderId){

localStorage.setItem(
FOLDER_STORAGE_KEY,
String(currentFolderId)
);

}else{

localStorage.removeItem(
FOLDER_STORAGE_KEY
);

}

}


function restoreCurrentFolder(){

const saved=
localStorage.getItem(
FOLDER_STORAGE_KEY
);

if(!saved){

currentFolderId=null;
return;
}

const id=Number(saved);

const exists=
allFolders.some(
folder=>folder.id===id
);

if(exists){

currentFolderId=id;

}else{

currentFolderId=null;

localStorage.removeItem(
FOLDER_STORAGE_KEY
);

}

}


/* =========================
   LOAD FOLDERS
========================= */

async function loadFolders(){

folders.innerHTML=
'<div class="empty">⏳ Folder লোড হচ্ছে...</div>';

const {data,error}=
await supabaseClient
.from("folders")
.select("id,name,parent_id")
.order(
"id",
{ascending:true}
);

if(error){

console.error(error);

folders.innerHTML=
'<div class="empty">❌ Folder লোড করা যায়নি।</div>';

return false;
}

allFolders=data || [];

restoreCurrentFolder();

renderFolders();

return true;

}


/* =========================
   CURRENT PATH
========================= */

function getCurrentPath(){

if(!currentFolderId){
return [];
}

const result=[];

let id=currentFolderId;

while(id){

const folder=
allFolders.find(
item=>item.id===id
);

if(!folder){
break;
}

result.unshift(
folder.name
);

id=folder.parent_id;

}

return result;

}


function getStoragePath(){

if(!currentFolderId){
return "";
}

return getFolderStoragePath(
currentFolderId
);


}


function getFolderStoragePath(folderId){

const parts=[];

let id=folderId;

while(id){

const folder=
allFolders.find(
item=>item.id===id
);

if(!folder){
break;
}

parts.unshift(
"folder_"+folder.id
);

id=folder.parent_id;

}

return parts.join("/");

}

========================= */

folder=>

/* =========================
   OPEN / HOME / BACK
========================= */

function openFolder(id){

currentFolderId=id;

saveCurrentFolder();

renderFolders();

loadPhotos();

}


function goHome(){

currentFolderId=null;

saveCurrentFolder();

renderFolders();

loadPhotos();

}


function goBack(){

if(!currentFolderId){
return;
}

const current=
allFolders.find(
folder=>
folder.id===
currentFolderId
);

currentFolderId=
current
?
current.parent_id
:
null;

saveCurrentFolder();

renderFolders();

loadPhotos();

}


/* =========================
   CREATE FOLDER
========================= */

async function createFolder(){

if(!requireAdmin()){
return;
}

const folderName=
prompt(
currentFolderId
?
"Sub-folder-এর নাম লিখুন:"
:
"নতুন Folder-এর নাম লিখুন:"
);

if(!folderName){
return;
}

const cleanName=
folderName.trim();

if(!cleanName){
return;
}


const exists=
allFolders.some(
folder=>
folder.parent_id===
currentFolderId &&
folder.name.toLowerCase()===
cleanName.toLowerCase()
);

if(exists){

alert(
"এই নামে Folder আগে থেকেই আছে।"
);

return;
}


const {error}=
await supabaseClient
.from("folders")
.insert({
name:cleanName,
parent_id:currentFolderId
});

if(error){

alert(
"❌ Folder তৈরি হয়নি: "+
error.message
);

return;
}

message.textContent=
"✅ Folder তৈরি হয়েছে।";

await loadFolders();

}


/* =========================
   RENAME
========================= */

async function renameFolder(folder){

if(!requireAdmin()){
return;
}

const newName=
prompt(
"নতুন Folder নাম লিখুন:",
folder.name
);

if(!newName){
return;
}

const cleanName=
newName.trim();

if(!cleanName){
return;
}

if(cleanName===folder.name){
return;
}


const exists=
allFolders.some(
item=>
item.id!==folder.id &&
item.parent_id===
folder.parent_id &&
item.name.toLowerCase()===
cleanName.toLowerCase()
);

if(exists){

alert(
"এই নামে Folder আগে থেকেই আছে।"
);

return;
}


const {error}=
await supabaseClient
.from("folders")
.update({
name:cleanName
})
.eq(
"id",
folder.id
);

if(error){

alert(
"❌ Rename হয়নি: "+
error.message
);

return;
}

message.textContent=
"✅ Folder Rename হয়েছে।";

await loadFolders();

loadPhotos();

}


/* =========================
   DESCENDANTS
========================= */

function getDescendantIds(parentId){

const result=[];

const children=
allFolders.filter(
folder=>
folder.parent_id===
parentId
);

for(const child of children){

result.push(child.id);

result.push(
...getDescendantIds(
child.id
)
);

}

return result;

}


/* =========================
   STORAGE LIST
========================= */

async function listStorageFiles(path){

const {data,error}=
await supabaseClient
.storage
.from("photos")
.list(
path,
{limit:1000}
);

if(error){

console.error(error);

return null;
}

const files=[];

for(const item of data || []){

const fullPath=
path
?
path+"/"+item.name
:
item.name;

if(item.metadata){

files.push(fullPath);

}else{

const childFiles=
await listStorageFiles(
fullPath
);

if(childFiles===null){
return null;
}

files.push(
...childFiles
);

}

}

return files;

}


async function deleteStorageTree(path){

if(!isAdmin){
return false;
}

const files=
await listStorageFiles(path);

if(files===null){
return false;
}

if(files.length===0){
return true;
}

const {error}=
await supabaseClient
.storage
.from("photos")
.remove(files);

if(error){

console.error(error);

return false;
}

return true;

}


/* =========================
   DELETE FOLDER
========================= */

async function deleteFolder(folder){

if(!requireAdmin()){
return;
}

const answer=
confirm(
'🗑️ "'+
folder.name+
'" Folder Delete করবেন?\n\nএই Folder-এর ভিতরের ছবি ও Sub-folder-ও মুছে যাবে।'
);

if(!answer){
return;
}

message.textContent=
"⏳ Folder Delete হচ্ছে...";


const ids=
getDescendantIds(
folder.id
);

ids.push(folder.id);


for(const id of ids){

const storagePath=
getFolderStoragePath(id);

const removed=
await deleteStorageTree(
storagePath
);

if(!removed){

message.textContent=
"❌ Folder-এর ছবি Delete করা যায়নি।";

return;
}

}


const {error}=
await supabaseClient
.from("folders")
.delete()
.in(
"id",
ids
);

if(error){

alert(
"❌ Folder Delete হয়নি: "+
error.message
);

return;
}


message.textContent=
"✅ Folder Delete হয়েছে।";


if(
ids.includes(
currentFolderId
)
){

currentFolderId=
folder.parent_id;

saveCurrentFolder();

}


await loadFolders();

loadPhotos();

}

/* =========================
   FILE EXTENSION
========================= */

function getFileExtension(file){

const originalName=
file.name || "";

const dot=
originalName.lastIndexOf(".");

if(
dot!==-1 &&
dot<originalName.length-1
){

const ext=
originalName
.substring(dot+1)
.toLowerCase()
.replace(
/[^a-z0-9]/g,
""
);

if(ext){
return ext;
}

}

if(file.type==="image/png"){
return "png";
}

if(file.type==="image/webp"){
return "webp";
}

if(file.type==="image/gif"){
return "gif";
}

return "jpg";

}

/* =========================
   LOCAL LIKE FALLBACK
========================= */

function getLocalLikes(){

try{

return JSON.parse(
localStorage.getItem(
LOCAL_LIKE_KEY
) || "{}"
);

}catch(e){

return {};

}

}


function saveLocalLikes(data){

try{

localStorage.setItem(
LOCAL_LIKE_KEY,
JSON.stringify(data)
);

}catch(e){}

}


function getLocalLike(photoName){

const likes=
getLocalLikes();

return Number(
likes[photoName] || 0
);

}


function addLocalLike(photoName){

const likes=
getLocalLikes();

likes[photoName]=
Number(likes[photoName] || 0)+1;

saveLocalLikes(likes);

return likes[photoName];

}

/* =========================
   ADD LIKE
========================= */

async function addLike(
photoName,
button
){

if(button.disabled){
return;
}

button.disabled=true;


try{

const {
data:oldData,
error:readError
}=
await supabaseClient
.from("photo_likes")
.select("like_count")
.eq(
"photo_name",
photoName
)
.maybeSingle();


if(readError){

console.warn(
"Supabase Like unavailable:",
readError
);

const localCount=
addLocalLike(photoName);

button.textContent=
"❤️ "+localCount;

button.classList.add("liked");

return;

}


if(!oldData){

const {error}=
await supabaseClient
.from("photo_likes")
.insert({
photo_name:photoName,
like_count:1
});


if(error){

console.warn(
"Like insert unavailable:",
error
);

const localCount=
addLocalLike(photoName);

button.textContent=
"❤️ "+localCount;

button.classList.add("liked");

return;

}


button.textContent=
"❤️ 1";

button.classList.add("liked");


}else{

const newCount=
Number(
oldData.like_count || 0
)+1;


const {error}=
await supabaseClient
.from("photo_likes")
.update({
like_count:newCount
})
.eq(
"photo_name",
photoName
);


if(error){

console.warn(
"Like update unavailable:",
error
);

const localCount=
addLocalLike(photoName);

button.textContent=
"❤️ "+localCount;

button.classList.add("liked");

return;

}


button.textContent=
"❤️ "+newCount;

button.classList.add("liked");

}


}catch(error){

console.error(error);

const localCount=
addLocalLike(photoName);

button.textContent=
"❤️ "+localCount;

button.classList.add("liked");


}finally{

button.disabled=false;

}

}

/* =========================
   PREVIOUS / NEXT
========================= */

function previousImage(){

if(!currentImages.length){
return;
}

currentViewerIndex--;

if(currentViewerIndex<0){

currentViewerIndex=
currentImages.length-1;

}

showViewerImage();

}


function nextImage(){

if(!currentImages.length){
return;
}

currentViewerIndex++;

if(
currentViewerIndex>=
currentImages.length
){

currentViewerIndex=0;

}

showViewerImage();

}


/* =========================
   SWIPE
========================= */

let touchStartX=0;
let touchEndX=0;


viewerImage.addEventListener(
"touchstart",
function(event){

touchStartX=
event.changedTouches[0].screenX;

},
{
passive:true
}
);


viewerImage.addEventListener(
"touchend",
function(event){

touchEndX=
event.changedTouches[0].screenX;


const difference=
touchEndX-touchStartX;


if(
Math.abs(difference)<50
){
return;
}


if(difference>0){

previousImage();

}else{

nextImage();

}

},
{
passive:true
}
);

const foldersLoaded=
await loadFolders();


if(foldersLoaded){

await loadPhotos();

}

}


startApp();
