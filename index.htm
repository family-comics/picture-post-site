<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top,#29230f 0%,#111 38%,#070707 100%);
  color:#eee;
}

button{
  box-sizing:border-box;
  border:1px solid #806719;
  border-radius:5px;
  padding:4px 6px;
  font-size:9px;
  cursor:pointer;
  background:#171717;
  color:#e8c957;
  transition:.15s;
}

button:active{
  transform:scale(.96);
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* HEADER */

header{
  background:
    linear-gradient(135deg,#080808,#211b0b);
  color:#fff;
  text-align:center;
  padding:7px 5px;
  position:sticky;
  top:0;
  z-index:20;
  border-bottom:1px solid #b89529;
  box-shadow:0 3px 18px rgba(0,0,0,.55);
}

header h1{
  margin:0;
  font-size:18px;
  color:#e5c557;
}

header p{
  margin:2px 0 4px;
  color:#aaa;
  font-size:8px;
}

.auth-area{
  display:flex;
  justify-content:center;
  gap:3px;
  flex-wrap:wrap;
}

.auth-button{
  background:#141414;
  color:#e7c650;
  border:1px solid #6d571b;
  padding:4px 7px;
  border-radius:5px;
  font-size:8px;
}

.admin-status{
  display:none;
  color:#d4af37;
  font-size:8px;
  margin-top:2px;
}

/* MAIN */

.container{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:4px;
}

/* TOP BUTTONS */

.top-buttons{
  display:flex;
  gap:4px;
  margin-bottom:4px;
}

.top-buttons button{
  flex:1;
  height:34px;
  background:#171717;
  color:#d9bd55;
  border:1px solid #6d571b;
  padding:3px 5px;
  font-size:9px;
  border-radius:5px;
  box-shadow:0 2px 7px rgba(0,0,0,.3);
}

/* BOX */

.box{
  background:rgba(20,20,20,.96);
  padding:6px;
  border-radius:7px;
  margin-bottom:4px;
  border:1px solid #3d341c;
  box-shadow:0 2px 10px rgba(0,0,0,.3);
}

.box h2{
  margin:0 0 4px;
  font-size:11px;
  color:#e0c45a;
}

#currentFolder{
  color:#999;
  font-size:8px;
  margin-bottom:4px;
  word-break:break-word;
}

/* FOLDER ACTIONS */

.folder-actions{
  display:flex;
  gap:3px;
  margin-bottom:4px;
}

.folder-actions button{
  flex:1;
  height:30px;
  background:#171717;
  color:#d7ba4f;
  border:1px solid #5d4d19;
  padding:3px 2px;
  font-size:8px;
  border-radius:5px;
}

/* FOLDERS */

.folders{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}

.folder{
  background:
    linear-gradient(145deg,#1d1d1d,#111);
  padding:2px;
  border-radius:5px;
  border:1px solid #4b401e;
  min-width:0;
  box-shadow:0 1px 5px rgba(0,0,0,.3);
}

.folder-open{
  width:100%;
  height:auto;
  background:transparent;
  border:0;
  padding:2px 1px;
  text-align:center;
  color:#ddd;
}

.folder-icon{
  display:block;
  font-size:14px;
  line-height:14px;
  margin-bottom:0;
}

.folder-name{
  display:block;
  font-size:7px;
  line-height:9px;
  font-weight:bold;
  word-break:break-word;
  color:#d8c77c;
}

.folder-manage{
  display:flex;
  gap:2px;
  margin-top:1px;
}

.folder-manage button{
  flex:1;
  padding:2px 0;
  font-size:6px;
  line-height:10px;
  border-radius:3px;
  white-space:nowrap;
}

.rename-button{
  background:#211e12;
  color:#d7bb54;
  border:1px solid #6b591d;
}

.delete-button{
  background:#251313;
  color:#ef7777;
  border:1px solid #713434;
}

/* FILE INPUT */

input[type=file]{
  width:100%;
  height:34px;
  margin:3px 0;
  font-size:8px;
  line-height:22px;
  color:#aaa;
  background:#111;
  border:1px solid #4b4328;
  border-radius:5px;
  padding:3px;
}

/* PREVIEW */

#previewArea{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:3px;
  margin:3px 0;
}

.preview-item{
  position:relative;
  background:#111;
  border-radius:4px;
  overflow:hidden;
  aspect-ratio:1/1;
  border:1px solid #443b20;
}

.preview-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.preview-number{
  position:absolute;
  left:2px;
  top:2px;
  background:rgba(0,0,0,.8);
  color:#f0cc58;
  padding:1px 3px;
  border-radius:3px;
  font-size:6px;
}

/* UPLOAD */

#uploadButton{
  width:100%;
  height:38px;
  background:
    linear-gradient(135deg,#9a7617,#d7b53d);
  color:#0c0c0c;
  border:0;
  padding:4px;
  font-size:9px;
  font-weight:bold;
  border-radius:5px;
}

#message{
  text-align:center;
  margin-top:3px;
  font-size:8px;
  font-weight:bold;
  word-break:break-word;
  color:#d3b94e;
}

/* GALLERY */

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:3px;
}

.photo-card{
  background:#111;
  border-radius:6px;
  overflow:hidden;
  border:1px solid #3e3825;
  box-shadow:0 2px 7px rgba(0,0,0,.4);
  position:relative;
}

.photo-number{
  position:absolute;
  top:3px;
  left:3px;
  z-index:5;
  background:rgba(0,0,0,.78);
  color:#f0cc58;
  padding:1px 4px;
  border-radius:4px;
  font-size:7px;
  font-weight:bold;
}

.photo-card img{
  width:100%;
  height:145px;
  object-fit:cover;
  display:block;
  cursor:pointer;
}

.photo-info{
  padding:3px;
}

.like-button{
  width:100%;
  background:#171717;
  color:#aaa;
  border:1px solid #443f31;
  margin-bottom:2px;
  padding:3px;
  font-size:8px;
}

.like-button.liked{
  background:#32151c;
  color:#ff6575;
  border-color:#803746;
}

.photo-delete-button{
  width:100%;
  background:#291313;
  color:#ee7777;
  border:1px solid #713535;
  padding:3px;
  font-size:8px;
}

/* EMPTY */

.empty{
  text-align:center;
  color:#777;
  padding:9px 5px;
  grid-column:1/-1;
  font-size:9px;
}

/* LOGIN */

#loginModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:10px;
}

.login-box{
  width:100%;
  max-width:330px;
  background:#171717;
  border:1px solid #a88929;
  border-radius:10px;
  padding:12px;
  box-shadow:0 5px 30px rgba(0,0,0,.7);
}

.login-box h2{
  margin:0 0 9px;
  text-align:center;
  color:#e2c454;
  font-size:15px;
}

.login-box input{
  width:100%;
  padding:8px;
  margin-bottom:5px;
  background:#0d0d0d;
  color:#eee;
  border:1px solid #4b4328;
  border-radius:6px;
  font-size:11px;
  outline:none;
}

.login-submit{
  width:100%;
  background:#d4af37;
  color:#111;
  border:0;
  margin-top:2px;
  padding:7px;
  font-size:10px;
  font-weight:bold;
}

.login-close{
  width:100%;
  background:#222;
  color:#aaa;
  border:1px solid #444;
  margin-top:4px;
  padding:6px;
  font-size:9px;
}

#loginMessage{
  text-align:center;
  font-size:9px;
  margin-top:5px;
  word-break:break-word;
  color:#d2b54c;
}

/* VIEWER */

#viewer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.97);
  z-index:100;
  display:none;
  flex-direction:column;
}

.viewer-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px;
  flex-shrink:0;
}

.viewer-top button{
  background:#191919;
  color:#e8c957;
  border:1px solid #5d4d1c;
  padding:5px 7px;
  font-size:9px;
}

.viewer-stage{
  position:relative;
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

#viewerImage{
  width:100%;
  height:100%;
  object-fit:contain;
  min-height:0;
  padding:5px 38px;
}

.viewer-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:5;
  width:31px;
  height:45px;
  border-radius:8px;
  background:rgba(255,255,255,.1);
  color:#f0cc58;
  border:1px solid rgba(220,180,60,.35);
  font-size:20px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.viewer-prev{left:4px}
.viewer-next{right:4px}

.viewer-bottom{
  display:flex;
  justify-content:center;
  padding:6px;
  flex-shrink:0;
}

#viewerLike{
  background:#751c2c;
  color:#fff;
  border:1px solid #a8384b;
  min-width:90px;
  padding:6px 9px;
  font-size:9px;
}

/* MOBILE */

@media(max-width:420px){

  .container{
    padding:3px;
  }

  .box{
    padding:5px;
    margin-bottom:4px;
  }

  .box h2{
    font-size:10px;
    margin-bottom:3px;
  }

  #currentFolder{
    margin-bottom:3px;
  }

  .top-buttons{
    gap:3px;
    margin-bottom:3px;
  }

  .top-buttons button{
    height:31px;
    padding:2px 4px;
    font-size:8px;
  }

  .folder-actions{
    gap:3px;
    margin-bottom:3px;
  }

  .folder-actions button{
    height:28px;
    padding:2px;
    font-size:7px;
  }

  .folders{
    grid-template-columns:repeat(3,1fr);
    gap:2px;
  }

  .folder{
    padding:1px;
  }

  .folder-icon{
    font-size:13px;
    line-height:13px;
  }

  .folder-name{
    font-size:7px;
    line-height:8px;
  }

  .folder-manage{
    gap:1px;
    margin-top:1px;
  }

  .folder-manage button{
    font-size:5px;
    line-height:9px;
    padding:1px 0;
  }

  input[type=file]{
    height:32px;
    font-size:8px;
    padding:2px;
  }

  #uploadButton{
    height:36px;
    font-size:8px;
  }

  #previewArea{
    grid-template-columns:repeat(4,1fr);
    gap:2px;
  }

  .gallery{
    gap:3px;
  }

  .photo-card img{
    height:130px;
  }

  .like-button,
  .photo-delete-button{
    padding:3px;
    font-size:7px;
  }

  .empty{
    padding:8px 4px;
  }

  #viewerImage{
    padding-left:35px;
    padding-right:35px;
  }

  .viewer-arrow{
    width:29px;
    height:42px;
    font-size:18px;
  }
}
</style>
