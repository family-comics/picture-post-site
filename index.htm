<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  color:#222;
}

button{
  border:1px solid #d0d0d0;
  border-radius:7px;
  padding:7px 10px;
  font-size:11px;
  cursor:pointer;
  background:#fff;
  color:#222;
}

button:active{
  transform:scale(.97);
}

button:disabled{
  opacity:.55;
}

/* HEADER */
header{
  background:#111;
  color:#fff;
  text-align:center;
  padding:10px 8px;
  position:sticky;
  top:0;
  z-index:20;
  border-bottom:2px solid #d4af37;
}

header h1{
  margin:0;
  font-size:20px;
  color:#d4af37;
}

header p{
  margin:3px 0 7px;
  color:#ccc;
  font-size:10px;
}

.auth-area{
  display:flex;
  justify-content:center;
  gap:5px;
  flex-wrap:wrap;
}

.auth-button{
  background:#222;
  color:#f0cc58;
  border:1px solid #6d571b;
  padding:6px 9px;
  border-radius:6px;
  font-size:10px;
}

.admin-status{
  display:none;
  color:#d4af37;
  font-size:9px;
  margin-top:4px;
}

/* MAIN */
.container{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:7px;
}

/* HOME / BACK */
.top-buttons{
  display:flex;
  gap:5px;
  margin-bottom:7px;
}

.top-buttons button{
  flex:1;
  background:#fff;
  color:#333;
  border:1px solid #ccc;
  padding:7px;
  font-size:10px;
}

/* BOX */
.box{
  background:#fff;
  padding:9px;
  border-radius:10px;
  margin-bottom:7px;
  border:1px solid #ddd;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.box h2{
  margin:0 0 6px;
  font-size:13px;
  color:#222;
}

#currentFolder{
  color:#777;
  font-size:9px;
  margin-bottom:6px;
  word-break:break-word;
}

/* FOLDER ACTIONS */
.folder-actions{
  display:flex;
  gap:5px;
  margin-bottom:6px;
}

.folder-actions button{
  flex:1;
  background:#f7f7f7;
  color:#333;
  border:1px solid #ccc;
  padding:6px 4px;
  font-size:9px;
}

/* FOLDERS */
.folders{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.folder{
  background:#fafafa;
  padding:4px 2px;
  border-radius:8px;
  border:1px solid #ddd;
  min-width:0;
}

.folder-open{
  width:100%;
  background:transparent;
  border:0;
  padding:4px 1px;
  text-align:center;
  color:#222;
}

.folder-icon{
  display:block;
  font-size:18px;
  line-height:19px;
  margin-bottom:1px;
}

.folder-name{
  display:block;
  font-size:9px;
  line-height:11px;
  font-weight:bold;
  word-break:break-word;
  color:#333;
}

.folder-manage{
  display:flex;
  gap:2px;
  margin-top:3px;
}

.folder-manage button{
  flex:1;
  padding:3px 1px;
  font-size:7px;
  border-radius:5px;
  white-space:nowrap;
}

.rename-button{
  background:#fff8df;
  color:#725900;
  border:1px solid #d9bd55;
}

.delete-button{
  background:#fff0f0;
  color:#b22;
  border:1px solid #e0aaaa;
}

/* FILE INPUT */
input[type="file"]{
  width:100%;
  margin:5px 0;
  font-size:10px;
  color:#555;
  background:#fff;
  border:1px solid #ccc;
  border-radius:6px;
  padding:5px;
}

/* PREVIEW */
#previewArea{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  margin:5px 0;
}

.preview-item{
  position:relative;
  background:#eee;
  border-radius:6px;
  overflow:hidden;
  aspect-ratio:1/1;
  border:1px solid #ddd;
}

.preview-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.preview-number{
  position:absolute;
  left:3px;
  top:3px;
  background:rgba(0,0,0,.75);
  color:#fff;
  padding:1px 4px;
  border-radius:4px;
  font-size:7px;
}

/* UPLOAD */
#uploadButton{
  width:100%;
  background:#d4af37;
  color:#111;
  border:0;
  padding:8px;
  font-size:10px;
  font-weight:bold;
  border-radius:7px;
}

#message{
  text-align:center;
  margin-top:5px;
  font-size:9px;
  font-weight:bold;
  word-break:break-word;
  color:#8a6d00;
}

/* GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:5px;
}

.photo-card{
  background:#fff;
  border-radius:8px;
  overflow:hidden;
  border:1px solid #ddd;
  box-shadow:0 2px 7px rgba(0,0,0,.08);
  position:relative;
}

.photo-number{
  position:absolute;
  top:4px;
  left:4px;
  z-index:5;
  background:rgba(0,0,0,.75);
  color:#fff;
  padding:2px 5px;
  border-radius:5px;
  font-size:8px;
  font-weight:bold;
}

.photo-card img{
  width:100%;
  height:155px;
  object-fit:cover;
  display:block;
  cursor:pointer;
}

.photo-info{
  padding:4px;
}

.like-button{
  width:100%;
  background:#f7f7f7;
  color:#555;
  border:1px solid #ddd;
  margin-bottom:3px;
  padding:5px;
  font-size:9px;
}

.like-button.liked{
  background:#fff0f3;
  color:#d22;
  border-color:#e5a5ad;
}

.photo-delete-button{
  width:100%;
  background:#fff0f0;
  color:#b22;
  border:1px solid #e0aaaa;
  padding:5px;
  font-size:9px;
}

/* EMPTY */
.empty{
  text-align:center;
  color:#777;
  padding:14px 6px;
  grid-column:1/-1;
  font-size:10px;
}

/* LOGIN */
#loginModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
}

.login-box{
  width:100%;
  max-width:340px;
  background:#fff;
  border:1px solid #d4af37;
  border-radius:12px;
  padding:14px;
  box-shadow:0 5px 30px rgba(0,0,0,.4);
}

.login-box h2{
  margin:0 0 10px;
  text-align:center;
  color:#222;
  font-size:16px;
}

.login-box input{
  width:100%;
  padding:9px;
  margin-bottom:6px;
  background:#fff;
  color:#222;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:12px;
  outline:none;
}

.login-submit{
  width:100%;
  background:#d4af37;
  color:#111;
  border:0;
  margin-top:3px;
  padding:8px;
  font-size:11px;
  font-weight:bold;
}

.login-close{
  width:100%;
  background:#f3f3f3;
  color:#555;
  border:1px solid #ddd;
  margin-top:5px;
  padding:7px;
  font-size:10px;
}

#loginMessage{
  text-align:center;
  font-size:10px;
  margin-top:6px;
  word-break:break-word;
  color:#9a7900;
}

/* VIEWER */
#viewer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.96);
  z-index:100;
  display:none;
  flex-direction:column;
}

.viewer-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:7px;
  flex-shrink:0;
}

.viewer-top button{
  background:#222;
  color:#f0cc58;
  border:1px solid #6d571b;
  padding:6px 8px;
  font-size:10px;
}

.viewer-stage{
  position:relative;
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

#viewerImage{
  width:100%;
  height:100%;
  object-fit:contain;
  min-height:0;
  padding:5px 42px;
}

.viewer-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:5;
  width:34px;
  height:50px;
  border-radius:9px;
  background:rgba(255,255,255,.15);
  color:#f0cc58;
  border:1px solid rgba(220,180,60,.4);
  font-size:22px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.viewer-prev{
  left:5px;
}

.viewer-next{
  right:5px;
}

.viewer-bottom{
  display:flex;
  justify-content:center;
  padding:7px;
  flex-shrink:0;
}

#viewerLike{
  background:#8b1e2d;
  color:#fff;
  border:1px solid #b53b4d;
  min-width:100px;
  padding:7px 10px;
  font-size:10px;
}

/* MOBILE */
@media(max-width:420px){

  .container{
    padding:5px;
  }

  .box{
    padding:7px;
    margin-bottom:6px;
  }

  .box h2{
    font-size:12px;
  }

  .folders{
    grid-template-columns:repeat(3,1fr);
    gap:3px;
  }

  .folder{
    padding:3px 1px;
  }

  .folder-icon{
    font-size:16px;
    line-height:17px;
  }

  .folder-name{
    font-size:8px;
    line-height:10px;
  }

  .folder-manage button{
    font-size:6.5px;
    padding:3px 0;
  }

  .folder-actions button{
    padding:5px 3px;
    font-size:8px;
  }

  #previewArea{
    grid-template-columns:repeat(4,1fr);
    gap:3px;
  }

  .gallery{
    gap:4px;
  }

  .photo-card img{
    height:140px;
  }

  .like-button,
  .photo-delete-button{
    padding:4px;
    font-size:8px;
  }

  #viewerImage{
    padding-left:38px;
    padding-right:38px;
  }

  .viewer-arrow{
    width:31px;
    height:45px;
    font-size:19px;
  }
}
</style>
